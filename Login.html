<div class="card">

<script>
const SUPABASE_URL = 'https://gpqlximhoqdybcewdfde.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_xUnGxyLCc5TB5nv4keVQVw__grqGJkP';
const sbClient = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

function togglePwVisibility_(inputId, btn){
  const el = document.getElementById(inputId);
  if (!el) return;
  const showing = el.type === 'text';
  el.type = showing ? 'password' : 'text';
  if (btn) btn.classList.toggle('active', !showing);
}

function showView(id){
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  document.querySelectorAll('.err').forEach(e => e.innerText = '');
}

let BUSY = false;
function setBusy_(busy, btnId, label){
  BUSY = busy;
  const btn = document.getElementById(btnId);
  if (btn) { btn.disabled = busy; btn.innerText = busy ? '처리 중...' : label; }
}

function isValidPasswordClient(pw){
  if (!pw || pw.length < 8 || pw.length > 10) return false;
  return /[a-zA-Z]/.test(pw) && /[0-9]/.test(pw) && /[^a-zA-Z0-9]/.test(pw);
}

async function hashPassword(password, phone) {
  const p = String(phone || '').replace(/[^0-9]/g, '');
  const data = new TextEncoder().encode(p + ':' + String(password));
  const hashBuf = await crypto.subtle.digest('SHA-256', data);
  return Array.from(new Uint8Array(hashBuf)).map(b => b.toString(16).padStart(2, '0')).join('');
}

function detectDeviceInfo_(){
  const ua = navigator.userAgent || '';
  let browser = '기타';
  if (/Edg\//.test(ua)) browser = 'Edge';
  else if (/SamsungBrowser/.test(ua)) browser = '삼성인터넷';
  else if (/Whale\//.test(ua)) browser = 'Whale';
  else if (/Chrome\//.test(ua)) browser = 'Chrome';
  else if (/Safari\//.test(ua)) browser = 'Safari';
  const isMobile = /Mobi|Android|iPhone|iPod/i.test(ua);
  return { browser: browser, deviceType: isMobile ? '모바일' : 'PC' };
}

function goToDestination_(session){
  try { sessionStorage.removeItem('s1_admin_session_v1'); } catch(e){}
  try { sessionStorage.removeItem('s1_session_v1'); } catch(e){}
  try { sessionStorage.setItem('s1_admin_session_v1', JSON.stringify(session)); } catch(e){}
  try { sessionStorage.setItem('s1_session_v1', JSON.stringify(session)); } catch(e){}
  document.getElementById('loadingOverlay').classList.add('show');
  window.location.href = session.isAdmin ? 'Admin.html' : 'Index.html';
}

async function doLogin(){
  if (BUSY) return;
  const phone = document.getElementById('login_phone').value.trim();
  const password = document.getElementById('login_password').value;
  const errEl = document.getElementById('login_err');
  errEl.innerText = '';
  if (!phone || !password) { errEl.innerText = '전화번호와 비밀번호를 입력하세요.'; return; }

  setBusy_(true, 'loginBtn', '로그인');
  try {
    const p = phone.replace(/[^0-9]/g, '');
    const { data, error } = await sbClient.from('app_users').select('*').eq('phone', p).maybeSingle();
    if (error || !data) {
      setBusy_(false, 'loginBtn', '로그인');
      errEl.innerText = '등록되지 않은 전화번호입니다.';
      return;
    }
    const hash = await hashPassword(password, p);
    if (hash !== data.hash) {
      setBusy_(false, 'loginBtn', '로그인');
      errEl.innerText = '비밀번호가 일치하지 않습니다.';
      return;
    }
    const role = data.role || '읽기전용';
    const session = {
      token: 'sess_' + p + '_' + Date.now(),
      name: data.name,
      phone: p,
      role: role,
      job: data.job || '',
      isAdmin: (role === '메인마스터' || role === '서브마스터' || role === '수정가능'),
      isMaster: (role === '메인마스터' || role === '서브마스터'),
      isMainMaster: (role === '메인마스터')
    };
    goToDestination_(session);
  } catch(err) {
    setBusy_(false, 'loginBtn', '로그인');
    errEl.innerText = '통신 오류: ' + String(err);
  }
}

async function doRegister(){
  if (BUSY) return;
  const name = document.getElementById('reg_name').value.trim();
  const phone = document.getElementById('reg_phone').value.trim();
  const password = document.getElementById('reg_password').value;
  const job = document.getElementById('reg_job').value;
  const errEl = document.getElementById('reg_err');
  errEl.innerText = '';
  if (!name || !job || !phone) { errEl.innerText = '모든 필드를 입력하세요.'; return; }
  if (!isValidPasswordClient(password)) {
    errEl.innerText = '비밀번호는 8~10자, 영문자·숫자·특수문자를 포함해야 합니다.';
    return;
  }
  setBusy_(true, 'registerBtn', '등록');
  try {
    const p = phone.replace(/[^0-9]/g, '');
    const hash = await hashPassword(password, p);
    const { error } = await sbClient.from('app_users').insert([{
      phone: p,
      name: name,
      hash: hash,
      job: job,
      role: '읽기전용'
    }]);
    if (error) {
      setBusy_(false, 'registerBtn', '등록');
      errEl.innerText = '등록 실패: ' + (error.message || '이미 등록된 번호일 수 있습니다.');
      return;
    }
    const session = {
      token: 'sess_' + p + '_' + Date.now(),
      name: name,
      phone: p,
      role: '읽기전용',
      job: job,
      isAdmin: false,
      isMaster: false,
      isMainMaster: false
    };
    goToDestination_(session);
  } catch(err) {
    setBusy_(false, 'registerBtn', '등록');
    errEl.innerText = '통신 오류: ' + String(err);
  }
}
