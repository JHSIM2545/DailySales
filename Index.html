\<\!DOCTYPE html\>  
\<html\>  
\<head\>  
\<base target="\_top"\>  
\<meta charset="utf-8"\>  
\<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"\>\</script\>  
\<style\>  
 :root{  
 --header-bg:\#4a86e8; --header-fg:\#ffffff; --grid-line:\#cfd6dc;  
 --stripe:\#f6f8fa; --pink:\#f8d7da; --red:\#c00000; --blue:\#1155cc;  
 }  
 \* { box-sizing:border-box; }  
 body{ font-family:'Malgun Gothic','Segoe UI',sans-serif; margin:0; background:\#eef1f4; color:\#222; font-size:12pt; }  
 .topbar{ background:\#1c2f4a; color:\#fff; padding:14px 20px; display:flex; align-items:center; justify-content:space-between; }  
 .topbar h1{ margin:0; font-size:17px; font-weight:600; }  
 .topbar p{ margin:4px 0 0; font-size:16px; color:\#c7d2e0; }  
 .ai-report-topbtn{ background:\#2563eb; color:\#fff; border:none; padding:9px 26px; border-radius:6px; font-size:15px; font-weight:700; cursor:pointer; }  
 .ai-report-topbtn:hover{ background:\#1d4ed8; }  
 .sync-status{ font-size:16px; padding:4px 10px; border-radius:4px; white-space:nowrap; transition: all 0.3s; user-select:none; }  
 .sync-status.saving{ background:\#fff3cd; color:\#7a5c00; }  
 .sync-status.error{ background:\#ffebee; color:\#c00000; cursor:pointer; font-weight:bold; border:1px solid \#c00000; }  
 .sync-status.error:hover{ background:\#f8d7da; }  
 .sync-status.ok{ background:\#0a4b40; color:\#00ff00; font-weight:bold; border:1px solid \#00ff00; box-shadow:0 0 10px \#00ff00, inset 0 0 5px \#00ff00; text-shadow:0 0 5px \#00ff00; }  
 .tabs{ display:flex; background:\#dde3ea; border-bottom:2px solid \#4a86e8; }  
 .tab{ padding:10px 22px; cursor:pointer; font-size:13px; font-weight:600; color:\#5a6472; border-right:1px solid \#c7cfd8; }  
 .tab.active{ background:\#fff; color:\#1c2f4a; border-bottom:2px solid \#fff; margin-bottom:-2px; }  
 .tab.disabled{ color:\#a9b2bd; cursor:default; }  
 .tab-refresh-btn{ align-self:center; background:transparent; border:none; color:inherit; font-size:17px; cursor:pointer; padding:0 16px; line-height:1; opacity:.75; }  
 .tab-refresh-btn:hover:not(:disabled){ opacity:1; }  
 .tab-refresh-btn:disabled{ opacity:.3; cursor:default; }  
 .tab-refresh-btn.has-update{ animation: tabRefreshPulse 1.1s ease-in-out infinite; }  
 @keyframes tabRefreshPulse{ 0%,100%{ opacity:.75; } 50%{ opacity:.25; } }  
 .toolbar{ display:flex; align-items:center; gap:8px; padding:8px 16px; background:\#fff; border-bottom:1px solid var(--grid-line); font-size:16px; flex-wrap:wrap; }  
 .toolbar input\[type=text\]{ padding:5px 8px; border:1px solid \#c7cfd8; border-radius:3px; font-size:16px; width:200px; }  
 .toolbar select{ padding:5px 8px; border:1px solid \#c7cfd8; border-radius:3px; font-size:16px; }  
 .toolbar .radio-group{ display:flex; align-items:center; gap:10px; }  
 .toolbar .radio-group label{ display:flex; align-items:center; gap:3px; cursor:pointer; }  
 .toolbar .count{ margin-left:auto; color:\#667; }  
 .sum-total{ color:\#667; font-weight:600; white-space:nowrap; }  
 .toolbar .sum-total{ margin-left:auto; }  
 .toolbar .sum-total + .count{ margin-left:6px; }  
 .grid-top-sum{ display:flex; justify-content:flex-end; align-items:center; gap:8px; margin:2px 2px 6px; font-size:14px; }  
 .toolbar button{ padding:6px 12px; font-size:16px; border:1px solid \#c7cfd8; background:\#f4f6f8; border-radius:3px; cursor:pointer; }  
 .toolbar button:hover{ background:\#e9edf1; }  
 .toolbar button:disabled{ opacity:.45; cursor:not-allowed; }  
 .toolbar button:disabled:hover{ background:\#f4f6f8; }  
 .toolbar button.primary{ background:\#4a86e8; color:\#fff; border-color:\#3a6fc4; }  
 .grid-wrap{ overflow:auto; background:\#fff; height:calc(100vh - 158px); }  
 table{ border-collapse:collapse; width:100%; font-size:16px; white-space:nowrap; }  
 thead th{  
 position:sticky; top:0; background:var(--header-bg); color:var(--header-fg);  
 padding:7px 8px; border:1px solid \#3a6fc4; text-align:center; z-index:2; font-weight:600; cursor:pointer; user-select:none;  
 }  
 thead th:hover{ background:\#3a76d8; }  
 thead th .arrow{ font-size:10px; margin-left:3px; opacity:.85; }  
 tbody td{ padding:6px 6px; border:1px solid var(--grid-line); }  
 tr.status-total-row{ background:\#dfe6ee; font-weight:700; }  
 tr.status-total-row td{ border-top:2px solid \#1c2f4a; }  
 tbody tr:nth-child(even){ background:var(--stripe); }  
 tbody tr:hover{ background:\#eaf1ff; }  
 tbody tr.unsynced{ box-shadow: inset 3px 0 0 \#e0a800; }  
 tbody tr.sync-error{ box-shadow: inset 3px 0 0 \#c00000; }  
 td.auto{ padding:5px 8px; }  
 td input, td select{ width:100%; border:1px solid transparent; background:transparent; padding:4px 6px; font-size:16px; font-family:inherit; border-radius:3px; }  
 td input:hover, td select:hover{ border-color:\#c7cfd8; }  
 td input:focus, td select:focus{ border-color:\#4a86e8; background:\#fff; outline:none; }  
 td.num input{ text-align:right; }  
 td.center select{ text-align:center; }  
 td.fee input{ color:var(--blue); text-align:right; font-weight:500; }  
 td.contract-cell.unset input{ background:var(--pink); color:var(--red); font-weight:700; text-align:center; }  
 td.status-confirmed{ color:\#0a7a2f; font-weight:600; }  
 td.status-scheduled{ color:\#b8860b; font-weight:600; }  
 td.status-unknown{ color:\#999; }  
 td.status-defense{ color:\#1155cc; font-weight:600; }  
 td.amount-neg input{ color:var(--red); text-align:right; font-weight:500; }  
 td.amount-pos input{ color:var(--blue); text-align:right; font-weight:500; }  
 /\* 소팅 기준 열 강조 (노랑) \*/  
 td.sort-col{ background:rgb(255,255,0); font-weight:700; }  
 td.sort-col input, td.sort-col select{ background:rgb(255,255,0); font-weight:700; }  
 /\* 오늘 날짜 강조 (녹색) \*/  
 td.today-hl{ background:rgb(198,239,206); color:rgb(0,97,0); font-weight:600; }  
 td.today-hl input, td.today-hl select{ background:rgb(198,239,206); color:rgb(0,97,0); font-weight:600; }  
 /\* ===== 공통 그리드 표시 사양 (2026 개편) ===== \*/  
 th.flag-col{ width:30px; cursor:default; }  
 th.flag-col:hover{ background:var(--header-bg); }  
 td.flag-cell{ width:30px; text-align:center; padding:2px; }  
 tbody tr.flagged td{ background:rgb(220,230,240) \!important; color:rgb(0,0,255) \!important; }  
 tbody tr.flagged td input, tbody tr.flagged td select{ background:rgb(220,230,240) \!important; color:rgb(0,0,255) \!important; }  
 /\* 계약번호: 8자리 기준 폭 + 형식/중복 오류 강조 \*/  
 td.contract-cell{ width:92px; max-width:92px; }  
 td.contract-cell input{ text-align:center; }  
 td.contract-bad, td.contract-bad input{ background:rgb(255,200,200) \!important; color:rgb(150,0,0) \!important; text-align:center; font-weight:700; }  
 /\* 계약처명: 넓게 + 넘치면 말줄임(마우스오버 시 전체 명칭 툴팁) \*/  
 td.name-cell{ min-width:180px; max-width:230px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }  
 td.name-cell input{ width:100%; text-overflow:ellipsis; }  
 /\* 그로스 "법인" / 상품 "정보보안" 강조 \*/  
 td.gross-corp, td.gross-corp select, td.gross-corp input{ background:\#b9bec4 \!important; color:rgb(0,0,255) \!important; font-weight:700; }  
 td.prod-sec, td.prod-sec select, td.prod-sec input{ background:\#4b0f78 \!important; color:\#ffffff \!important; font-weight:700; }  
 /\* 정렬/폭 보조 \*/  
 td.money, td.money input{ text-align:right; }  
 td.center-cell, td.center-cell input{ text-align:center; }  
 td.datecol{ width:62px; max-width:62px; text-align:center; }  
 td.datecol input{ text-align:center; }  
 td.monthcol{ width:66px; max-width:66px; text-align:center; }  
 td.narrow{ width:64px; max-width:64px; }  
 td.wide-note{ min-width:240px; }  
 th.wide-note{ min-width:240px; }  
 /\* 인상인하 구분/금액 강조 \*/  
 td.pc-up, td.pc-up input{ background:rgb(200,255,255) \!important; color:rgb(0,150,150) \!important; font-weight:600; }  
 td.pc-down, td.pc-down input{ background:rgb(255,200,100) \!important; color:rgb(150,100,0) \!important; font-weight:600; }  
 td.amt-up, td.amt-up input{ color:rgb(0,0,255) \!important; text-align:right; font-weight:600; }  
 td.amt-down, td.amt-down input{ color:rgb(255,0,0) \!important; text-align:right; font-weight:600; }  
 td.rate-up{ color:rgb(0,0,255); text-align:center; font-weight:600; }  
 td.rate-down{ color:rgb(255,0,0); text-align:center; font-weight:600; }  
 td.pcbg-up, td.pcbg-up input{ background:rgb(200,255,255) \!important; }  
 td.pcbg-down, td.pcbg-down input{ background:rgb(255,200,100) \!important; }  
 td.money-black, td.money-black input{ text-align:right; color:\#222222 \!important; }  
 .status-wrap .grid-wrap table th, .status-wrap .grid-wrap table td{ width:66px; min-width:66px; text-align:right; }  
 .status-wrap .grid-wrap table th{ text-align:center; }  
 .status-wrap .grid-wrap table th:first-child, .status-wrap .grid-wrap table td:first-child{ width:84px; min-width:84px; text-align:center; }  
 .toolbar label.chk{ display:flex; align-items:center; gap:4px; cursor:pointer; user-select:none; white-space:nowrap; }  
 /\* 모달: 포커스된 입력창 노랑 배경 \*/  
 .modal .field input:focus, .modal .field select:focus, .modal .field textarea:focus{ background:rgb(255,255,0); outline:none; border-color:\#e0a800; }  
 /\* 영업현황 헤더 색상 \*/  
 .status-wrap thead th.date-head{ background:\#1a2744 \!important; color:\#ffffff \!important; border-color:\#0f1a2e; }  
 .status-wrap thead th.cum-head{ background:\#cfe8fa \!important; color:\#123a5c \!important; border-color:\#a8cfe8; }  
 .status-wrap td.datecell{ text-align:center; white-space:nowrap; }  
 .status-wrap td.datecell.holi{ color:\#c00000; font-weight:700; }  
 table.status-summary td, table.status-summary th{ width:104px; min-width:104px; text-align:right; }  
 table.status-summary th:first-child, table.status-summary td:first-child{ width:70px; min-width:70px; text-align:center; }  
 /\* 영업현황 \*/  
 .status-wrap{ padding:0 16px 16px; }  
 .status-head{ display:flex; align-items:center; gap:12px; padding:14px 0 6px; }  
 .status-head h2{ margin:0; font-size:16px; color:\#1c2f4a; }  
 .status-head button{ padding:4px 12px; border:1px solid \#c7cfd8; background:\#f4f6f8; border-radius:4px; cursor:pointer; font-size:13px; }  
 .status-target{ background:\#fff; border:1px solid var(--grid-line); border-radius:6px; padding:10px 14px; margin-bottom:10px; font-size:16px; }  
 .status-head{ margin-bottom:10px; }  
 .status-wrap .grid-wrap{ margin-top:10px; }  
 .daily-report-wrap .status-head{ position:sticky; top:0; z-index:6; background:\#fff; box-shadow:0 2px 4px rgba(0,0,0,.08); }  
 .status-wrap thead th.date-col-head{ background:\#fbdce6 \!important; color:\#1a2744 \!important; }  
 .daily-panels-row{ display:flex; gap:16px; align-items:flex-start; flex-wrap:wrap; }  
 .daily-panels-row .daily-panel-col{ flex:1 1 560px; min-width:560px; }  
 .status-target-title{ font-weight:700; color:\#1c2f4a; margin-bottom:6px; }  
 .report-box{ border:2px solid transparent; border-radius:6px; padding:6px; }  
 .report-box.active-report{ border-color:\#8e2f4e; background:\#fff5f8; }  
 .status-target-row{ display:flex; gap:16px; align-items:center; padding:3px 0; flex-wrap:wrap; }  
 .status-target-row .label{ font-weight:700; color:\#1c2f4a; min-width:110px; }  
 .status-target-row .ratio{ font-weight:700; color:\#0a7a2f; margin-left:auto; }  
 .status-target input{ width:110px; padding:4px 6px; border:1px solid \#c7cfd8; border-radius:3px; font-size:16px; }  
 .status-target button.save{ padding:5px 14px; background:\#4a86e8; color:\#fff; border:none; border-radius:4px; cursor:pointer; font-size:16px; }  
 table.status-summary{ width:auto; min-width:420px; border-collapse:collapse; }  
 table.status-summary th, table.status-summary td{ border:1px solid var(--grid-line); padding:5px 12px; font-size:16px; }  
 table.status-summary thead th{ position:static; background:\#eef1f4; color:\#333; }  
 table.status-summary tbody th{ background:\#f6f8fa; color:\#1c2f4a; text-align:left; }  
 table.status-summary-full tr.row-plan th, table.status-summary-full tr.row-plan td{ background:\#fbe4d5; }  
 table.status-summary-full tr.row-actual th, table.status-summary-full tr.row-actual td{ background:\#ffff00; font-weight:700; }  
 table.status-summary-full tr.row-ratio th, table.status-summary-full tr.row-ratio td{ color:\#1a3fd6; font-style:italic; }  
 .daily-actual-row th, .daily-actual-row td{ color:\#1a56db; font-weight:700; }  
 .daily-actual-row input{ color:\#1a56db; font-weight:700; }  
 table.status-summary-full tr.row-diff th, table.status-summary-full tr.row-diff td{ color:\#1a3fd6; }  
 .status-ratio{ margin-top:6px; font-size:16px; color:\#0a7a2f; font-weight:600; }  
 .status-filter-select{ margin-left:auto; padding:5px 10px; border:1px solid \#c7cfd8; border-radius:4px; font-size:16px; }  
 .status-wrap table{ font-size:16px; }  
 .status-wrap td.num{ text-align:right; }  
 .status-wrap tr.holiday-row td{ background:\#e3e5e8; }  
 .status-wrap tr.today-row td{ background:rgb(198,239,206); color:rgb(0,97,0); font-weight:600; }  
 .status-wrap th.gap-left, .status-wrap td.gap-left{ border-left:22px solid \#eef1f4; }  
 body.loading-cursor, body.loading-cursor \*{ cursor:wait \!important; }  
 td.actions{ text-align:center; }  
 td.actions button{ font-size:11px; padding:3px 8px; border:1px solid \#c7cfd8; background:\#f4f6f8; border-radius:3px; cursor:pointer; }  
 td.actions button.danger{ color:\#c00000; }  
 td.actions button.retry{ color:\#7a5c00; border-color:\#e0a800; }  
 .placeholder{ padding:60px 20px; text-align:center; color:\#8a93a0; }  
 .denied{ padding:60px 20px; text-align:center; color:\#c00000; }  
 .placeholder h2{ color:\#5a6472; }  
 .loading{ padding:40px; text-align:center; color:\#8a93a0; }  
 /\* 데이터를 불러오는 동안 "지금 뭔가 진행 중"이라는 느낌을 주기 위한 회전 스피너 + 진행률 표시.  
 에러 메시지(실패)에는 붙이지 않도록 별도 클래스(loading-spin)로만 적용한다. \*/  
 .loading-spin::before{  
 content:'';  
 display:block;  
 width:40px; height:40px;  
 margin:0 auto 16px;  
 border:4px solid \#dbeafe;  
 border-top-color:\#2563eb;  
 border-radius:50%;  
 animation:loading-spin-anim 0.8s linear infinite;  
 }  
 @keyframes loading-spin-anim{ to{ transform:rotate(360deg); } }  
 .loading-text{ font-size:20px; font-weight:600; color:\#4b5563; margin-bottom:16px; }  
 .loading-progress-track{ width:240px; height:12px; background:\#e3e6ea; border-radius:6px; margin:0 auto 10px; overflow:hidden; }  
 .loading-progress-fill{ height:100%; width:0%; background:\#2563eb; border-radius:6px; transition:width 0.2s linear; }  
 .loading-progress-pct{ font-size:18px; font-weight:700; color:\#2563eb; }  
  
 .modal-overlay{ display:none; position:fixed; inset:0; background:rgba(0,0,0,.4); align-items:center; justify-content:center; z-index:10; }  
 td.date-editable{ cursor:pointer; }  
 td.date-editable:hover{ text-decoration:underline; background:\#eef5ff; }  
 .modal-overlay.open{ display:flex; }  
 .modal{ background:\#fff; border-radius:8px; padding:20px 24px; width:640px; max-height:88vh; overflow:auto; }  
 .modal h2{ margin:0 0 14px; font-size:15px; color:\#1c2f4a; }  
 .field-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px 16px; }  
 .field{ display:flex; flex-direction:column; gap:3px; }  
 .field.full{ grid-column:1 / -1; }  
 .field label{ font-size:16px; color:\#555; font-weight:600; }  
 .field input, .field select, .field textarea{ padding:6px 8px; border:1px solid \#c7cfd8; border-radius:4px; font-size:16px; font-family:inherit; }  
 .field .err{ font-size:11px; color:\#c00000; min-height:14px; }  
 .modal-actions{ margin-top:16px; display:flex; justify-content:flex-end; gap:8px; }  
 .readonly-preview{ font-size:11px; color:\#667; background:\#f4f6f8; border-radius:4px; padding:8px; margin-bottom:12px; }  
 .userinfo{ font-size:16px; color:\#c7d2e0; display:flex; align-items:center; gap:10px; }  
 .userinfo a{ color:\#c7d2e0; cursor:pointer; text-decoration:underline; }  
 .login-modal{ width:360px; }  
 .login-modal .field{ margin-bottom:10px; }  
  
/\* 컨설턴트별 차트 스타일 \*/  
 .chart-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; }  
 .chart-card { background: \#fff; border: 1px solid \#c7cfd8; border-radius: 6px; padding: 10px; }  
 .chart-card-title { font-size: 13px; font-weight: bold; color: \#1c2f4a; margin-bottom: 8px; border-bottom: 1px solid \#eee; padding-bottom: 4px; display: flex; justify-content: space-between;}  
 .bar-row { display: flex; align-items: center; margin-bottom: 6px; gap: 6px; }  
 .bar-name { width: 45px; font-size: 12px; color: \#555; white-space: nowrap; font-weight: 600;}  
 .bar-track { flex: 1; height: 14px; background: \#eef1f4; border-radius: 3px; overflow: hidden; position: relative;}  
 .bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s; }  
 .bar-pct { width: 35px; font-size: 11px; text-align: right; color: \#333; font-weight: bold; }  
 .fill-suju { background: \#3a6fc4; }  
 .fill-gaesi { background: \#0a7a2f; }  
 .fill-dec { background: \#c00000; }  
 .fill-inc { background: \#b8860b; }  
  
 /\* 컨설턴트별 컬러 게이지/발산형 차트 (모든 차트 종류 공통) \*/  
 .bar-track.bipolar { position: relative; }  
 .bar-track.bipolar .zero-line { position: absolute; left: 50%; top: -2px; bottom: -2px; width: 1px; background: \#99a3ad; z-index: 2; }  
 .bar-fill.bipolar-fill { position: absolute; top: 0; height: 100%; border-radius: 2px; }  
  
 /\* ===== 종합 대시보드 ===== \*/  
 /\* 대시보드: 상단(제목/월이동/필터)은 고정하고, 그 아래 차트 영역만 스크롤되도록 flex 레이아웃으로 구성 \*/  
 .dash-wrap{ padding:0 16px 16px; display:flex; flex-direction:column; height:calc(100vh - 118px); }  
 .dash-head{ flex-shrink:0; }  
 .dash-scroll{ flex:1 1 auto; min-height:0; overflow-y:auto; padding-right:4px; }  
 .dash-head{ display:flex; align-items:center; gap:10px; padding:14px 0 10px; flex-wrap:wrap; }  
 .dash-head h2{ margin:0; font-size:16px; color:\#5c1c2f; }  
 .dash-head select{ padding:4px 8px; border:1px solid \#c7cfd8; border-radius:4px; font-size:13px; }  
 .dash-head button{ padding:4px 12px; border:1px solid \#c7cfd8; background:\#f4f6f8; border-radius:4px; cursor:pointer; font-size:13px; }  
 .dash-progress{ background:\#eef1f4; border-radius:4px; padding:8px 12px; font-size:13px; color:\#333; margin:6px 0 14px; }  
 .dash-section{ margin-bottom:24px; }  
 .dash-section-title{ font-size:15px; font-weight:bold; color:\#1c2f4a; margin:0 0 10px; padding-bottom:5px; border-bottom:2px solid \#5c1c2f; }  
 .dash-kpi-row{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:10px; }  
 .dash-kpi{ background:\#fff; border:1px solid \#c7cfd8; border-radius:6px; padding:8px 14px; min-width:120px; }  
 .dash-kpi .lbl{ font-size:11px; color:\#888; }  
 .dash-kpi .val{ font-size:16px; font-weight:bold; color:\#1c2f4a; }  
 .comp-bar-row{ display:flex; align-items:center; margin-bottom:5px; gap:6px; }  
 .comp-bar-name{ width:92px; font-size:12px; color:\#555; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }  
 .comp-bar-track{ flex:1; height:14px; background:\#eef1f4; border-radius:3px; overflow:hidden; }  
 .comp-bar-fill{ height:100%; border-radius:3px; transition: width 0.5s; }  
 .comp-bar-val{ width:100px; font-size:11px; text-align:right; color:\#333; }  
 .comp-bar-row-overall{ font-weight:bold; padding-bottom:6px; margin-bottom:6px; border-bottom:1px dashed \#c7cfd8; }  
 .comp-bar-row-overall .comp-bar-name{ color:\#000; }

\<script\>  
/\* ===================== 설정값 ===================== \*/  
const HEADERS = \['개시','수주월','개시월','이월','구분','계약번호','계약처명','영업담당','영업동기','담당차량','보고일','계약일','개시일','기산일','용역료','상품','그로스','비고','유형'\];  
const EDITABLE\_FIELDS = \['계약번호','계약처명','영업담당','영업동기','담당차량','보고일','계약일','개시일','기산일','용역료','상품','그로스','비고','유형'\];  
const AUTO\_FIELDS = \['개시','수주월','개시월','이월','구분'\];  
  
const LIST\_SALES\_REP = \['최영국','이수열','박광춘','정문재','임영민'\];  
const LIST\_MOTIVE = \['개척','콜센터','사내소개','고객소개','대리점','관내이전','관외이전','그로스','기타'\];  
const LIST\_CAR = \[26,27,28,127,160\];  
const LIST\_PRODUCT = \['알람','휴엔','정보보안','블루스캔','유지보수'\];  
const LIST\_GROSS = \['일반','법인'\];  
// '직접등록'(수기 입력)/'자동등록'(영업보고 자동분석→등록) 구분값. 수주개시/해약중지/인상인하 공통 사용.  
const LIST\_REG\_TYPE = \['직접등록','자동등록'\];  
  
const FIELD\_TYPE = {  
 계약번호:'text', 계약처명:'text', 영업담당:'select', 영업동기:'select', 담당차량:'select',  
 보고일:'date', 계약일:'date', 개시일:'date', 기산일:'text', 용역료:'number',  
 상품:'select', 그로스:'select', 비고:'text', 유형:'select'  
};  
const FIELD\_OPTIONS = {  
 영업담당:LIST\_SALES\_REP, 영업동기:LIST\_MOTIVE, 담당차량:LIST\_CAR, 상품:LIST\_PRODUCT, 그로스:LIST\_GROSS, 유형:LIST\_REG\_TYPE  
};  
  
/\* 2026\~2027 대한민국 법정공휴일 (Code.gs 공휴일 시트와 동일 기준) \*/  
const HOLIDAYS = new Set(\[  
 '2026-01-01','2026-02-16','2026-02-17','2026-02-18','2026-03-01','2026-03-02',  
 '2026-05-05','2026-05-08','2026-06-06','2026-08-15','2026-08-17',  
 '2026-09-24','2026-09-25','2026-09-26','2026-09-27','2026-10-03','2026-10-05','2026-10-09','2026-12-25',  
 '2027-01-01','2027-02-06','2027-02-07','2027-02-08','2027-02-09','2027-03-01',  
 '2027-05-05','2027-05-13','2027-06-06','2027-08-15','2027-08-16',  
 '2027-09-14','2027-09-15','2027-09-16','2027-10-03','2027-10-04','2027-10-09','2027-10-11','2027-12-25','2027-12-27'  
\]);  
function isWeekend(d){ const wd = new Date(d+'T00:00:00').getDay(); return wd===0||wd===6; }  
function isBlockedDate(d){ return isWeekend(d) || HOLIDAYS.has(d); }  
function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }  
function yyyymm(d){ return d ? d.slice(0,7) : ''; }  
function addDaysStr(dateStr, days){  
 const d = new Date(dateStr + 'T00:00:00');  
 d.setDate(d.getDate() + days);  
 return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');  
}  
function nextBusinessDay(dateStr){  
 let d = dateStr;  
 while (isBlockedDate(d)) d = addDaysStr(d, 1);  
 return d;  
}  
/\* 콤마 서식: 그리드/입력폼 공용 \*/  
function formatMoneyInput(el){  
 const raw = el.value.replace(/\[^0-9\]/g, '');  
 el.value = raw ? Number(raw).toLocaleString('ko-KR') : '';  
}  
function moneyValue(el){ return el.value.replace(/\[^0-9\]/g, ''); }  
function commaFmt(v){  
 if (v === '' || v === null || v === undefined) return '';  
 const n = Number(String(v).replace(/,/g, ''));  
 return isNaN(n) ? v : n.toLocaleString('ko-KR');  
}  
/\* ===================== 공통 표시 서식 헬퍼 (2026 개편) ===================== \*/  
/\* 계약번호 형식: N + 숫자 7\~8자리 \*/  
const CONTRACT\_RE = /^Nd{7,8}$/;  
function currentYear(){ return new Date().getFullYear(); }  
  
/\*\* 날짜를 "M/D"(당해년) 또는 "YY/M/D"(타년도)로 표기. 미정/해약방어 등 문자열은 그대로 \*/  
function fmtMD(v){  
 const s = String(v === null || v === undefined ? '' : v).trim();  
 const m = s.match(/^(d{4})-(d{2})-(d{2})/);  
 if (\!m) return s;  
 const y = Number(m\[1\]), mo = Number(m\[2\]), d = Number(m\[3\]);  
 return (y === currentYear()) ? (mo + '/' + d) : (String(y).slice(2) + '/' + mo + '/' + d);  
}  
/\*\* "YYYY-MM"을 "M월"(당해년) 또는 "YY\_M월"(타년도)로 표기 \*/  
function fmtMonth(v){  
 const s = String(v === null || v === undefined ? '' : v).trim();  
 const m = s.match(/^(d{4})-(d{2})$/);  
 if (\!m) return s;  
 const y = Number(m\[1\]), mo = Number(m\[2\]);  
 return (y === currentYear()) ? (mo + '월') : (String(y).slice(2) + '\_' + mo + '월');  
}  
/\*\* 그리드 날짜 입력값 파싱: YYYY-MM-DD / M/D / YY/M/D / YYYY/M/D / 미정 / 해약방어 \*/  
function parseDateInput(v){  
 const s = String(v === null || v === undefined ? '' : v).trim();  
 if (\!s) return '';  
 if (s === '미정' || s === '해약방어') return s;  
 if (/^d{4}-d{1,2}-d{1,2}$/.test(s)) {  
 const p = s.split('-');  
 return p\[0\] + '-' + String(p\[1\]).padStart(2,'0') + '-' + String(p\[2\]).padStart(2,'0');  
 }  
 let m = s.match(/^(d{1,2})/(d{1,2})$/);  
 if (m) return currentYear() + '-' + String(m\[1\]).padStart(2,'0') + '-' + String(m\[2\]).padStart(2,'0');  
 m = s.match(/^(d{4})/(d{1,2})/(d{1,2})$/);  
 if (m) return m\[1\] + '-' + String(m\[2\]).padStart(2,'0') + '-' + String(m\[3\]).padStart(2,'0');  
 m = s.match(/^(d{2})/(d{1,2})/(d{1,2})$/);  
 if (m) return '20' + m\[1\] + '-' + String(m\[2\]).padStart(2,'0') + '-' + String(m\[3\]).padStart(2,'0');  
 return null;  
}  
function escAttr(v){ return String(v === null || v === undefined ? '' : v).replace(/"/g,'&quot;'); }  
function escHtml(v){ return String(v === null || v === undefined ? '' : v).replace(/&/g,'&amp;').replace(/\</g,'&lt;').replace(/\>/g,'&gt;'); }  
  
/\*\* 계약번호 셀 오류 여부: N+7\~8자리가 아니거나 같은 값이 다른 행에 중복 \*/  
function contractCellBad(val, allRows, key){  
 const s = String(val === null || val === undefined ? '' : val).trim();  
 if (\!s) return false;  
 if (\!CONTRACT\_RE.test(s)) return true;  
 let cnt = 0;  
 for (let i = 0; i \< allRows.length; i++) {  
 if (String(allRows\[i\]\[key\] === null || allRows\[i\]\[key\] === undefined ? '' : allRows\[i\]\[key\]).trim() === s) cnt++;  
 if (cnt \> 1) return true;  
 }  
 return false;  
}  
  
/\*\* 확정일/기산일 등이 "아직 지나지 않은(=처리 대기)" 상태인지 - 오늘 포함 이후 또는 미정/해약방어 \*/  
function isPendingDate(v){  
 const s = String(v === null || v === undefined ? '' : v).trim();  
 if (\!s) return true;  
 if (\!/^d{4}-d{2}-d{2}$/.test(s)) return true; // 미정 / 해약방어 등  
 return s \>= todayStr();  
}  
  
/\*\* 체크박스 상태 읽기 (없으면 defaultVal) \*/  
function chkVal(id, defaultVal){  
 const el = document.getElementById(id);  
 return el ? el.checked : \!\!defaultVal;  
}  
  
  
/\*\* 부호(음수) 허용 금액 입력 서식 \*/  
function formatSignedMoneyInput(el){  
 const neg = /^s\*-/.test(el.value);  
 const raw = el.value.replace(/\[^0-9\]/g, '');  
 el.value = raw ? ((neg ? '-' : '') + Number(raw).toLocaleString('ko-KR')) : (neg ? '-' : '');  
}  
function signedMoneyValue(el){  
 const neg = /^s\*-/.test(el.value);  
 const raw = el.value.replace(/\[^0-9\]/g, '');  
 return raw ? ((neg ? '-' : '') + raw) : '';  
}  
  
/\*\* 영업현황 일자 표기: "8/26(수)" \*/  
function weekdayKo(dateStr){  
 const d = new Date(String(dateStr) + 'T00:00:00');  
 return isNaN(d.getTime()) ? '' : \['일','월','화','수','목','금','토'\]\[d.getDay()\];  
}  
function fmtStatusDate(ds){  
 const m = String(ds||'').match(/^(d{4})-(d{2})-(d{2})$/);  
 if (\!m) return String(ds||'');  
 return Number(m\[2\]) + '/' + Number(m\[3\]) + '(' + weekdayKo(ds) + ')';  
}  
/\* ---- 깃발(임시 마크) : 클라이언트 상태만 유지 ---- \*/  
/\* ---- 깃발(서버 동기화 영구 마크) ---- \*/  
let FLAGGED\_SET = new Set();  
google.script.run.withSuccessHandler(function(res){   
FLAGGED\_SET = new Set(res);   
if(currentTab === 'order\_start') render(); else if(currentTab === 'cancel') renderCancel(); else if(currentTab === 'price\_change') renderPrice(); else if(currentTab === 'restart') renderRestart(); else if(currentTab === 'product\_daily') renderProductDaily();   
}).getGlobalFlags();  
  
function toggleFlag(scope, id){  
 const isSet = \!FLAGGED\_SET.has(id);  
 if (isSet) FLAGGED\_SET.add(id); else FLAGGED\_SET.delete(id);  
  
 // 깃발 체크/해제만으로는 화면에 보이는 행 집합이 바뀌지 않으므로(선택된 항목만 필터는 인쇄/엑셀 내보내기에만 적용됨),  
 // 표 전체를 다시 그리지 않고 해당 행의 강조(flagged) 클래스만 직접 갱신해서 스크롤 위치/포커스가 유지되도록 함.  
 // 행을 화면에서 찾을 수 없는 예외적인 경우에만 전체 재렌더링으로 폴백.  
 const tr = document.querySelector('tr\[data-id="' + id + '"\]');  
 if (tr) {  
 tr.classList.toggle('flagged', isSet);  
 updateFlaggedSumDisplay\_(scope);  
 } else if (scope === 'order') render(); else if (scope === 'restart') renderRestart(); else if (scope === 'cancel') renderCancel(); else if (scope === 'price') renderPrice(); else if (scope === 'productdaily') renderProductDaily();  
 google.script.run.toggleGlobalFlag(id, isSet);  
}  
function flagCellHtml(scope, id){  
 return '\<td class="flag-cell"\>\<input type="checkbox" title="깃발 표시" ' + (FLAGGED\_SET.has(id) ? 'checked ' : '') + 'onclick="toggleFlag('' + scope + '','' + id + '')"\>\</td\>';  
}  
function flagHeaderHtml(){ return '\<th class="flag-col no-sort" title="깃발"\>&\#9873;\</th\>'; }  
function flagRowClass(scope, id){ return FLAGGED\_SET.has(id) ? ' flagged' : ''; }  
/\*\* 체크(깃발)로 선택된 행만 대상으로 지정 필드 합계를 "합계 : 000,000,000원" 형식으로 반환.  
 \* 선택된 행이 하나도 없으면 빈 문자열을 반환해 아무것도 표시하지 않는다. \*/  
function flaggedSumText\_(rows, field){  
 const flagged = (rows || \[\]).filter(r =\> FLAGGED\_SET.has(r.id));  
 if (\!flagged.length) return '';  
 const total = flagged.reduce((s, r) =\> s + (Number(String(r\[field\] || '0').replace(/,/g, '')) || 0), 0);  
 return '합계 : ' + total.toLocaleString('ko-KR') + '원';  
}  
/\*\* 표 전체를 다시 그리지 않고 깃발(체크)만 토글했을 때도 상단 "합계 : ..." 표시가 바로 갱신되도록  
 \* 해당 화면의 합계 span만 다시 계산해서 채워준다. \*/  
function updateFlaggedSumDisplay\_(scope){  
 if (scope === 'order') {  
 const el = document.getElementById('rowSumOrder'); if (el) el.innerText = flaggedSumText\_(sortedRows(), '용역료');  
 updateCopyButtonState\_('order', sortedRows());  
 } else if (scope === 'cancel') {  
 const el = document.getElementById('rowSumCancel'); if (el) el.innerText = flaggedSumText\_(sortedCancelRows(), '용역료');  
 updateCopyButtonState\_('cancel', sortedCancelRows());  
 } else if (scope === 'price') {  
 const el = document.getElementById('rowSumPrice'); if (el) el.innerText = flaggedSumText\_(sortedPriceRows(), '금액');  
 updateCopyButtonState\_('price', sortedPriceRows());  
 } else if (scope === 'restart') {  
 const el = document.getElementById('rowSumRestart'); if (el) el.innerText = flaggedSumText\_(sortedRestartRows(), '용역료');  
 updateCopyButtonState\_('restart', sortedRestartRows());  
 } else if (scope === 'productdaily') {  
 const el = document.getElementById('productDailyTopSum'); if (el) el.innerText = flaggedSumText\_(sortedProductDailyRows(), '합계');

}

function onColResize(e) {

const STALE\_SCOPES\_ = new Set();  
const TAB\_TO\_SCOPES\_ = {  
 order\_start: \['order'\], cancel: \['cancel'\], price\_change: \['price'\],  
 restart: \['restart'\], product\_daily: \['productdaily'\],  
 dashboard: \['order','cancel','price','restart','productdaily'\],  
 sales\_status: \['order','cancel','price','restart','productdaily'\],  
 daily\_report: \['order','cancel','price','restart','productdaily'\]  
};  
// 위 3개(대시보드/영업현황/일일실적보고)는 5개 시트를 모두 합산하는 화면이라, 지금 그 화면을 보고 있을  
// 때 바뀐 시트를 즉시(조용히) 다시 계산해 화면에 반영해버리면 결국 "사용 중 강제 새로고침"과 같은  
// 효과가 나므로(기존 scheduleDependentCachesRefresh\_ 로직), 이 3개 화면이 활성 화면일 때는  
// invalidateScopeCacheQuiet\_를 써서 캐시만 비우고 새로고침 버튼만 켠다.  
const AGGREGATE\_TABS\_ = { dashboard: 1, sales\_status: 1, daily\_report: 1 };  
// 다른 화면 데이터가 바뀌었을 때 화면을 건드리지 않고 조용히 다시 받아 캐시만 채워두는 함수 모음  
// (로그인 시 전체를 미리 받아두는 preloadAllTabsInBackground\_와 별개로, 특정 scope 하나만 다시 받을 때 사용).  
const SCOPE\_PRELOAD\_FN\_ = {  
 order: function(){ preloadSilent\_('orderStartData\_', function(cb){ google.script.run.withSuccessHandler(cb).withFailureHandler(function(){}).getOrderStartData(SESSION.token, ''); }); },  
 cancel: function(){ preloadSilent\_('cancelData\_', function(cb){ google.script.run.withSuccessHandler(cb).withFailureHandler(function(){}).getCancelData(SESSION.token, ''); }); },  
 price: function(){ preloadSilent\_('priceData\_', function(cb){ google.script.run.withSuccessHandler(cb).withFailureHandler(function(){}).getPriceData(SESSION.token, ''); }); },  
 restart: function(){ preloadSilent\_('restartData\_', function(cb){ google.script.run.withSuccessHandler(cb).withFailureHandler(function(){}).getRestartData(SESSION.token, ''); }); },  
 productdaily: function(){ preloadSilent\_('productDailyData', function(cb){ google.script.run.withSuccessHandler(cb).withFailureHandler(function(){}).getProductDailyData(SESSION.token); }); }  
};  
function checkSheetFreshness\_(){  
 if (\!SESSION || \!SESSION.token) return; // 로그인 전에는 확인하지 않음  
 google.script.run  
 .withSuccessHandler(function(versions){  
 if (\!versions || versions.error) return;  
 const scopes = \['order', 'cancel', 'price', 'restart', 'productdaily'\];  
 const isFirstCheck = \!DATA\_VERSION\_INITED\_;  
 const activeScopes = TAB\_TO\_SCOPES\_\[currentTab\] || \[\];  
 scopes.forEach(function(scope){  
 const v = Number(versions\[scope\]) || 0;  
 if (isFirstCheck) { LAST\_SEEN\_SHEET\_VERSION\_\[scope\] = v; return; } // 로그인 직후 기준값만 세팅(불필요한 재조회 방지)  
 if (v \<= LAST\_SEEN\_SHEET\_VERSION\_\[scope\]) return;  
 LAST\_SEEN\_SHEET\_VERSION\_\[scope\] = v;  
 if (activeScopes.indexOf(scope) \!== -1) {  
 // 지금 보고 있는 화면과 관련된 시트가 바뀜 → 화면은 그대로 두고, 캐시만 비운 뒤 새로고침 버튼만 켠다.  
 if (AGGREGATE\_TABS\_\[currentTab\]) invalidateScopeCacheQuiet\_(scope); else invalidateScopeCache\_(scope);  
 STALE\_SCOPES\_.add(scope);  
 } else {  
 // 다른 화면의 시트가 바뀜 → 화면 건드리지 않고 조용히 백그라운드로 다시 받아 캐시만 채워둔다.  
 invalidateScopeCache\_(scope);  
 SCOPE\_PRELOAD\_FN\_\[scope\]();  
 }  
 });  
 if (isFirstCheck) DATA\_VERSION\_INITED\_ = true;  
 updateManualRefreshBtn\_();  
 })  
 .withFailureHandler(function(){ /\* 확인 실패는 조용히 무시(다음 주기에 다시 시도) \*/ })  
 .getSheetVersions(SESSION.token);  
}  
/\*\* 우측 상단 수동 새로고침(ð) 버튼: 지금 보고 있는 화면과 관련된 시트 중 아직 반영하지 않은 변경이  
 \* 있을 때만 활성화한다. \*/  
function updateManualRefreshBtn\_(){  
 const btn = document.getElementById('manualRefreshBtn');  
 if (\!btn) return;  
 const activeScopes = TAB\_TO\_SCOPES\_\[currentTab\] || \[\];  
 const stale = activeScopes.some(function(s){ return STALE\_SCOPES\_.has(s); });  
 btn.disabled = \!stale;  
 btn.classList.toggle('has-update', stale);  
 btn.title = stale ? '새로운 데이터가 있습니다. 클릭하여 새로고침' : '최신 상태입니다(새로고침 불필요)';  
}  
/\*\* 수동 새로고침 버튼 클릭 시: 지금 보고 있는 화면만 실제로 다시 불러온다. \*/  
function manualRefreshNow\_(){  
 const activeScopes = TAB\_TO\_SCOPES\_\[currentTab\] || \[\];  
 activeScopes.forEach(function(s){ STALE\_SCOPES\_.delete(s); });  
 if (currentTab === 'order\_start') loadData();  
 else if (currentTab === 'cancel') loadCancelData();  
 else if (currentTab === 'price\_change') loadPriceData();  
 else if (currentTab === 'restart') loadRestartData();  
 else if (currentTab === 'product\_daily') loadProductDailyData();  
 else if (currentTab === 'dashboard') { DASH\_DATA = null; loadDashboard(); }  
 else if (currentTab === 'sales\_status') { SALES\_STATUS\_LATEST\_ = null; loadSalesStatus(); }  
 else if (currentTab === 'daily\_report' && typeof loadDailyReport === 'function') { delete CLIENT\_CACHE\_\['dailyReport|' + dailyReportDate\]; loadDailyReport(); }  
 const popup = document.getElementById('salesStatusPopupOverlay');  
 if (popup && popup.classList.contains('open')) showSalesStatusPopup\_();  
 updateManualRefreshBtn\_();  
}  
setInterval(checkSheetFreshness\_, 30000);  
  
  
// 2026-09-18: "세션 유지 시 자동 로그인" 문제로 인해 localStorage 대신 sessionStorage를 사용한다.  
// sessionStorage는 이 브라우저 탭(창)을 완전히 닫으면 사라지므로, 로그인 후 화면을 계속 쓰는  
// 동안에는 유지되지만 브라우저를 재시작하거나 새로 접속하면 다시 로그인해야 한다.  
function loadSession(){  
 try { const raw = sessionStorage.getItem(SESSION\_STORAGE\_KEY); return raw ? JSON.parse(raw) : null; } catch(e){ return null; }  
}  
function saveSession(s){ sessionStorage.setItem(SESSION\_STORAGE\_KEY, JSON.stringify(s)); }  
function clearSession(){ sessionStorage.removeItem(SESSION\_STORAGE\_KEY); }  
  
/\*\* 화면을 열어두고 있는 동안 60초마다 서버에 "생존 신호"를 보낸다(사용자관리에서 "실시간 접속" 여부를  
 \* 판단하는 용도). 로그아웃하지 않고 브라우저 탭/창을 닫거나 PC를 끄면 이 신호가 곧 끊기므로, 실제로  
 \* 로그아웃했는지 여부와 무관하게 "지금 화면을 보고 있는지"를 유추할 수 있다. \*/  
let HEARTBEAT\_TIMER\_ = null;  
function pingSessionOnce\_(){  
 if (\!SESSION || \!SESSION.token) return;  
 google.script.run.withFailureHandler(function(){}).pingSession(SESSION.token);  
}  
function startHeartbeat\_(){  
 if (HEARTBEAT\_TIMER\_) return;  
 pingSessionOnce\_();  
 HEARTBEAT\_TIMER\_ = setInterval(pingSessionOnce\_, 60000);  
}  
  
/\* ===================== 유휴시간 기준 세션 연장(2026-09-16, 2026-09-17 수정) =====================  
 \* 요청: "화면을 열고 작업 중이면 세션이 계속 유지되고, 화면을 닫거나 아무 조작 없이 방치하면 일정  
 \* 시간(1시간) 후 자동 종료되어야 한다."  
 \* 위 pingSessionOnce\_()(60초 주기 생존신호)는 화면이 "열려만" 있어도 자동으로 계속 불려서 세션을  
 \* 연장시키기에 부적합하다(방치해도 안 끊김). 그래서 실제 사용자 조작(클릭/키입력/입력/터치)이 있을  
 \* 때만 서버에 세션 연장을 요청하고, 너무 잦은 호출을 막기 위해 최소 2분 간격으로만 실제로 보낸다.  
 \* → 1시간 안에 한 번이라도 조작이 있으면 세션이 계속 연장되고, 화면을 닫거나 1시간 동안 아무 조작이  
 \* 없으면 서버의 세션 캐시가 자연히 만료되어 자동으로 로그아웃된 것과 같은 효과가 난다.  
 \* 2026-09-17 추가: 서버 세션이 자연히 만료될 때까지 기다리지 않고, 클라이언트에서도 마지막 조작 후  
 \* 경과 시간을 직접 추적해 같은 시점(1시간)에 화면을 어둡게 바꾸고 "사용하지 않는 시간이 경과하여  
 \* 자동 로그아웃 되었습니다."를 띄운 뒤 로그인 화면으로 돌려보낸다(화면을 열어둔 채 방치한 경우  
 \* 다음 조작이 있을 때까지 기다리지 않고 즉시 알려주기 위함). 아래 값은 Code.gs의  
 \* CONFIG.SESSION\_TTL\_SEC(초 단위)와 반드시 같은 값을 유지해야 한다. \*/  
const SESSION\_IDLE\_TIMEOUT\_MS\_ = 60 \* 60 \* 1000; // 1시간 — Code.gs CONFIG.SESSION\_TTL\_SEC(3600)과 일치시킬 것  
let LAST\_ACTIVITY\_EXTEND\_AT\_ = 0;  
let LAST\_RAW\_ACTIVITY\_AT\_ = Date.now(); // 서버 호출 여부와 무관하게 "마지막 실제 조작 시각"만 추적(유휴 판정용)  
let IDLE\_LOGGED\_OUT\_ = false;  
const ACTIVITY\_EXTEND\_MIN\_INTERVAL\_MS\_ = 2 \* 60 \* 1000; // 최소 2분 간격(서버 호출 과다 방지)  
function markUserActivity\_(){  
 LAST\_RAW\_ACTIVITY\_AT\_ = Date.now();  
 if (\!SESSION || \!SESSION.token) return;  
 const now = Date.now();  
 if (now - LAST\_ACTIVITY\_EXTEND\_AT\_ \< ACTIVITY\_EXTEND\_MIN\_INTERVAL\_MS\_) return;  
 LAST\_ACTIVITY\_EXTEND\_AT\_ = now;  
 google.script.run.withFailureHandler(function(){}).extendSession(SESSION.token);  
}  
\['click', 'keydown', 'input', 'touchstart'\].forEach(function(evt){  
 document.addEventListener(evt, markUserActivity\_, { passive: true });  
});  
/\*\* 30초마다 "마지막 실제 조작 후 얼마나 지났는지"를 확인해서, 유휴 타임아웃(SESSION\_IDLE\_TIMEOUT\_MS\_)을  
 \* 넘기면 서버 응답을 기다리지 않고 곧바로 화면을 어둡게 만들고 자동 로그아웃 처리한다. \*/  
setInterval(function(){  
 if (\!SESSION || \!SESSION.token || IDLE\_LOGGED\_OUT\_) return;  
 if (Date.now() - LAST\_RAW\_ACTIVITY\_AT\_ \>= SESSION\_IDLE\_TIMEOUT\_MS\_) forceIdleLogout\_();  
}, 30000);  
/\*\* 화면 전체를 어둡게 덮고 안내 문구를 띄운 뒤, 로그인 정보를 지우고 로그인 화면으로 돌려보낸다. \*/  
function forceIdleLogout\_(){  
 if (IDLE\_LOGGED\_OUT\_) return;  
 IDLE\_LOGGED\_OUT\_ = true;  
 try { if (HEARTBEAT\_TIMER\_) { clearInterval(HEARTBEAT\_TIMER\_); HEARTBEAT\_TIMER\_ = null; } } catch(e){}  
 clearSession();  
 const overlay = document.createElement('div');  
 overlay.style.cssText = 'position:fixed; inset:0; background:rgba(20,20,20,.88); z-index:99999; display:flex; align-items:center; justify-content:center; color:\#fff; text-align:center; padding:24px;';  
 overlay.innerHTML = '\<div style="max-width:420px;"\>\<div style="font-size:38px; margin-bottom:14px;"\>ð\</div\>' +  
 '\<div style="font-size:17px; font-weight:600; line-height:1.5;"\>사용하지 않는 시간이 경과하여 자동 로그아웃 되었습니다.\</div\>' +  
 '\<button style="margin-top:20px; padding:9px 20px; font-size:14px; border:none; border-radius:6px; background:\#2563eb; color:\#fff; cursor:pointer;" onclick="redirectToLoginPage\_()"\>로그인 화면으로 이동\</button\>\</div\>';  
 document.body.appendChild(overlay);  
 setTimeout(function(){ redirectToLoginPage\_(); }, 2500); // 안내문을 잠깐 보여준 뒤 자동으로 로그인 화면으로 이동  
}  
  
function redirectToLoginPage\_(message){

 // Apps Script 화면은 구글 샌드박스 iframe 안에서 실행되어 location.href 가 실제 /exec 주소와 다르므로,

// 로그인 시 나머지 탭 데이터를 조용히 미리 불러와 캐시만 채워둠(Admin.html과 동일 방식)  
function preloadSilent\_(cacheKey, runFn){  
 if (cacheGet\_(cacheKey, GRID\_CACHE\_TTL\_MS\_)) return; // 이미 채워져 있으면 다시 부를 필요 없음  
 try {  
 runFn(function(data){  
 if (data && \!data.error && data.success \!== false) cacheSet\_(cacheKey, data);  
 });  
 } catch (e) {}  
}

function isValidPasswordClient(pw){  
 if (\!pw || pw.length \< 8 || pw.length \> 10) return false;  
 const hasLetter = /\[a-zA-Z\]/.test(pw);  
 const hasDigit = /\[0-9\]/.test(pw);  
 const hasSpecial = /\[^a-zA-Z0-9\]/.test(pw);  
 return hasLetter && hasDigit && hasSpecial;  
}

 .withSuccessHandler(function(res){

 else document.getElementById('login\_err').innerText = (res && res.error) || '로그인에 실패했습니다.';  
 })  
 .withFailureHandler(function(err){  
 setAuthBusy\_(false, 'loginBtn', '로그인');

 })  
 .login(phone, password);  
}

 \* URL이 준비되면 그 창의 위치만 옮긴다. win이 없으면(팝업이 차단됐던 경우) 새로 열어본다. \*/  
function openTaPortalWithUrl\_(baseUrl, win){  
 const url = String(baseUrl || '').trim();  
 if (\!url) {  
 if (win && \!win.closed) { try { win.close(); } catch(e){} }  
 alert('TA 관리 포털 링크가 아직 설정되지 않았습니다. 관리자에게 문의해 주세요.');  
 return;  
 }  
 const sep = url.indexOf('?') === -1 ? '?' : '&';  
 // 메인마스터는 master=1&view=dashboard&device=pc로 접속하고, 그 외(컨설턴트 직군의 서브마스터 포함) 사용자는  
 // 일반 사용자와 동일하게 로그인한 본인 이름으로 접속한다.  
 const finalUrl = SESSION.isMainMaster  
 ? (url + sep + 'master=1&view=dashboard&device=pc')  
 : (url + sep + 'agent=' + encodeURIComponent(SESSION.name || '') + '&device=' + detectDeviceType\_());  
 if (win && \!win.closed) { win.location.href = finalUrl; } else { window.open(finalUrl, '\_blank'); }  
}  
/\*\* 서버에서 URL을 받아오는 동안(비동기) window.open을 나중에 호출하면 대부분의 브라우저가 사용자 클릭과

}

function polarToCartesian\_(cx, cy, r, angleDeg){  
 const rad = (angleDeg - 90) \* Math.PI / 180;  
 return { x: cx + r \* Math.cos(rad), y: cy + r \* Math.sin(rad) };  
}  
function pieSliceSvgPath\_(cx, cy, r, startAngle, endAngle){  
 const start = polarToCartesian\_(cx, cy, r, endAngle);  
 const end = polarToCartesian\_(cx, cy, r, startAngle);  
 const largeArc = (endAngle - startAngle) \> 180 ? 1 : 0;  
 return 'M ' + cx + ' ' + cy + ' L ' + start.x + ' ' + start.y + ' A ' + r + ' ' + r + ' 0 ' + largeArc + ' 0 ' + end.x + ' ' + end.y + ' Z';  
}  
function pieChartHtml\_(list, valueKey, pctKey, fmtFn, colorFn){  
 if (\!list || \!list.length) return '\<div style="color:\#999; font-size:14px; padding:6px 0;"\>데이터 없음\</div\>';  
 colorFn = colorFn || function(it, idx){ return COMP\_COLORS\[idx % COMP\_COLORS.length\]; };  
 const total = list.reduce(function(s,it){ return s + (Number(it\[valueKey\])||0); }, 0);  
 let angle = 0;  
 const r = 50, cx = 55, cy = 55;  
 let svg = '\<svg width="110" height="110" viewBox="0 0 110 110"\>';  
 if (total \<= 0) {  
 svg += '\<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="\#eef1f4"\>\</circle\>';  
 } else {  
 list.forEach(function(it, idx){  
 const val = Number(it\[valueKey\]) || 0;  
 const frac = val / total;  
 if (frac \<= 0) return;  
 const startAngle = angle;  
 const endAngle = angle + frac \* 360;  
 angle = endAngle;  
 const color = colorFn(it, idx);  
 if (frac \>= 0.9999) {  
 svg += '\<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+color+'"\>\</circle\>';  
 } else {  
 svg += '\<path d="' + pieSliceSvgPath\_(cx, cy, r, startAngle, endAngle) + '" fill="' + color + '"\>\</path\>';  
 }  
 });  
 }  
 svg += '\</svg\>';  
 const legend = list.map(function(it, idx){  
 const color = colorFn(it, idx);  
 const pct = it\[pctKey\];  
 const valDisp = fmtFn ? fmtFn(it\[valueKey\]) : it\[valueKey\];  
 return '\<div style="display:flex; align-items:center; gap:5px; font-size:13px; margin-bottom:3px;"\>' +  
 '\<span style="width:9px;height:9px;border-radius:2px;background:'+color+';display:inline-block;flex-shrink:0;"\>\</span\>' +  
 '\<span style="flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;"\>'+it.name+'\</span\>' +  
 '\<span style="color:\#666; white-space:nowrap;"\>'+pct+'% ('+valDisp+')\</span\>' +  
 '\</div\>';  
 }).join('');  
 return '\<div style="display:flex; gap:10px; align-items:flex-start;"\>' +  
 '\<div style="flex-shrink:0;"\>' + svg + '\</div\>' +  
 '\<div style="flex:1; min-width:0;"\>' + legend + '\</div\>' +  
 '\</div\>';  
}

 });

function avgAmountBarsHtml\_(order){  
 const overallItem = { name: '지사 전체', val: (order.overall && order.overall.avgAmount) || 0, isOverall: true };

 return { name: rep, val: d.avgAmount||0 };  
 }));

 return items.map(function(it){

 '\</div\>';  
 }).join('');  
}

function dashGaugeAxisMax\_(pctList){

// metricKey('수주'/'개시'/'유지감소'/'유지증가') 기준으로 담당자별 부여된 개인 목표를 조회.  
// repTargets는 getSalesStatus() 응답의 repTargets(=담당자별 목표, "컨설턴트별 목표 입력" 비율 배분 반영)를 그대로 전달받는다.  
function dashRepTargetFor\_(repTargets, rep, metricKey){  
 const t = repTargets && repTargets\[rep\];  
 return t ? (Number(t\[REP\_TARGET\_FIELD\_\[metricKey\]\]) || 0) : 0;  
}  
  
function dashGaugeSectionHtml\_(title, metricKey, targetTotal, planTotal, actualTotal, repMetrics, repTargets, workingInfo, lowerIsBetter, showHundredLine){  
 targetTotal = Number(targetTotal) || 0; planTotal = Number(planTotal) || 0; actualTotal = Number(actualTotal) || 0;  
 // 지사 목표를 인원수로 균등 분배하지 않고, "컨설턴트별 목표 입력" 탭에서 부여한 개인별 목표를 그대로 사용한다.  
 const reps = DASH\_REP\_LIST;  
 const pctList = reps.map(function(rep){  
 const val = (repMetrics && repMetrics\[rep\] && repMetrics\[rep\]\[metricKey\]) || 0;  
 const tgt = dashRepTargetFor\_(repTargets, rep, metricKey);  
 return tgt \!== 0 ? (val / tgt) \* 100 : 0;  
 });  
 const axisMax = dashGaugeAxisMax\_(pctList);  
 const perRepTargetSum = reps.reduce(function(s, rep){ return s + dashRepTargetFor\_(repTargets, rep, metricKey); }, 0);  
 const wi = workingInfo || { totalWorkingDays: 0, elapsedWorkingDays: 0 };  
 const expectedPct = wi.totalWorkingDays ? Math.round((wi.elapsedWorkingDays / wi.totalWorkingDays) \* 100) : 0;  
 const overallPct = targetTotal ? Math.round((actualTotal / targetTotal) \* 100) : 0;  
 const onTrack = lowerIsBetter ? (overallPct \<= expectedPct) : (overallPct \>= expectedPct);  
 const paceNote = onTrack ? '양호' : (lowerIsBetter ? '주의(해약 과다)' : '지연');  
  
 let html = '\<div class="dash-kpi-row"\>' +  
 '\<div class="dash-kpi"\>\<div class="lbl"\>목표\</div\>\<div class="val"\>' + fmtK(targetTotal) + '천원\</div\>\</div\>' +  
 '\<div class="dash-kpi"\>\<div class="lbl"\>계획\</div\>\<div class="val"\>' + fmtK(planTotal) + '천원\</div\>\</div\>' +  
 '\<div class="dash-kpi"\>\<div class="lbl"\>실적\</div\>\<div class="val"\>' + fmtK(actualTotal) + '천원\</div\>\</div\>' +  
 '\<div class="dash-kpi"\>\<div class="lbl"\>달성률\</div\>\<div class="val"\>' + overallPct + '%\</div\>\</div\>' +  
 '\<div class="dash-kpi"\>\<div class="lbl"\>워킹데이 진척\</div\>\<div class="val"\>' + wi.elapsedWorkingDays + '/' + wi.totalWorkingDays + '일 (' + expectedPct + '%)\</div\>\</div\>' +  
 '\</div\>';  
 html += '\<div class="dash-progress"\>워킹데이 기준 목표 진척률 ' + expectedPct + '% 대비 실제 달성률 ' + overallPct + '% &rarr; \<b\>' + paceNote + '\</b\>\</div\>';  
 html += '\<div class="chart-grid"\>\<div class="chart-card"\>\<div class="chart-card-title"\>\<span\>' + title + ' (컨설턴트별)\</span\>' +  
 '\<span style="font-weight:normal; color:\#888;"\>목표(개인 합계): ' + fmtK(perRepTargetSum) + (axisMax \> 100 ? (' (0\~' + axisMax + '% 표시)') : '') + '\</span\>\</div\>';  
 reps.forEach(function(rep, idx){  
 const val = (repMetrics && repMetrics\[rep\] && repMetrics\[rep\]\[metricKey\]) || 0;  
 const tgt = dashRepTargetFor\_(repTargets, rep, metricKey);  
 const pct = Math.round(pctList\[idx\]);  
 const barWidth = Math.min(Math.max((pct / axisMax) \* 100, 0), 100);  
 const color = DASH\_REP\_COLORS\[rep\] || '\#888';  
 const hundredLineHtml = showHundredLine ? ('\<div style="position:absolute; left:' + (100/axisMax\*100) + '%; top:-2px; bottom:-2px; width:1px; background:\#c00000; z-index:2;"\>\</div\>') : '';  
 html += '\<div class="bar-row" title="실적: ' + fmtK(val) + ' / 목표: ' + fmtK(tgt) + '"\>' +  
 '\<div class="bar-name"\>' + rep + '\</div\>' +  
 '\<div class="bar-track"\>' + hundredLineHtml + '\<div class="bar-fill" style="width: ' + barWidth + '%; background: ' + color + ';"\>\</div\>\</div\>' +  
 '\<div class="bar-pct"\>' + pct + '%\</div\>' +  
 '\</div\>';  
 });  
 html += '\</div\>\</div\>';  
 return html;  
}

/\*\* 아직 못 불러왔을 때만 서버(또는 캐시)에서 \[선택한 날짜 이전이거나 같은 날짜 중 가장 최신\] 사업팀 데이터를  
 \* 받아온 뒤 cb를 호출한다. 이미 불러온 상태면 즉시 리턴(불필요한 재조회/재귀 렌더 방지). \*/  
function ensureBizTeamStatusLoaded\_(cb){  
 if (BIZ\_TEAM\_STATUS\_DATA\_) return;  
 const cacheKey = bizTeamStatusCacheKey\_();  
 const cached = cacheGet\_(cacheKey, GRID\_CACHE\_TTL\_MS\_);  
 if (cached) { BIZ\_TEAM\_STATUS\_DATA\_ = cached; if (cb) cb(); return; }  
 google.script.run  
 .withSuccessHandler(function(res){  
 BIZ\_TEAM\_STATUS\_DATA\_ = res || { success: false, error: '알 수 없는 오류' };  
 if (res && res.success) cacheSet\_(cacheKey, res);  
 if (cb) cb();  
 })  
 .withFailureHandler(function(err){ BIZ\_TEAM\_STATUS\_DATA\_ = { success: false, error: String(err) }; if (cb) cb(); })  
 .getBizTeamDataNearestOnOrBefore(SESSION.token, BIZ\_TEAM\_VIEW\_DATE\_, BIZ\_TEAM\_VIEW\_PRODUCT\_);  
}  
/\*\* 상단의 기준일자/상품종류 선택이 바뀌면 호출 — 조건이 달라졌으니 다시 조회한다(캐시에 있으면 즉시 표시). \*/  
function bizTeamViewFilterChanged\_(){  
 const dateInput = document.getElementById('bizTeamViewDate');  
 const newDate = dateInput.value || todayStr();  
 // 토·일·공휴일은 사업팀 데이터가 없는 날이므로 선택하지 못하도록 막고, 이전에 선택돼 있던 날짜로 되돌린다.  
 if (isBlockedDate(newDate)) {  
 alert('토·일·공휴일은 선택할 수 없습니다. 평일을 선택해 주세요.');  
 dateInput.value = BIZ\_TEAM\_VIEW\_DATE\_;  
 return;  
 }  
 BIZ\_TEAM\_VIEW\_DATE\_ = newDate;  
 BIZ\_TEAM\_VIEW\_PRODUCT\_ = document.getElementById('bizTeamViewProduct').value || '일반알람';  
 BIZ\_TEAM\_STATUS\_DATA\_ = null;  
 renderDashboard();  
}  
/\*\* 날짜 입력창 좌우 화살표 버튼 — 토·일·공휴일은 건너뛰고 가장 가까운 평일로 이동한 뒤 곧바로 재조회/재렌더링한다. \*/  
function bizTeamShiftViewDate\_(deltaDays){  
 const input = document.getElementById('bizTeamViewDate');  
 if (\!input || \!input.value) return;  
 const d = new Date(input.value + 'T00:00:00');  
 const step = deltaDays \>= 0 ? 1 : -1;  
 do {  
 d.setDate(d.getDate() + step);  
 } while (isBlockedDate(fmtDate(d)));  
 input.value = fmtDate(d);  
 bizTeamViewFilterChanged\_();  
}  
function bizTeamFindRow\_(rows, label){  
 return (rows || \[\]).find(function(r){ return r.label === label; }) || null;  
}  
function bizTeamParseNum\_(v){  
 const n = parseFloat(String(v || '').replace(/\[^0-9.\-\]/g, ''));  
 return isNaN(n) ? 0 : n;  
}  
/\*\* 내림차순 정렬된 items(각 {value,...})를 받아 동일 순위 처리(표준경쟁순위: 1,1,1,4,4,4,4,8식)를 적용한  
 \* 순위 배열을 반환한다. 값이 같으면 같은 순위, 다음 값은 그 앞까지의 인원 수만큼 건너뛴 순위를 받는다. \*/  
function bizTeamComputeRanks\_(sortedItems){  
 const ranks = \[\];  
 let prevValue = null, prevRank = 0;  
 sortedItems.forEach(function(it, idx){  
 if (prevValue \!== null && it.value === prevValue) {  
 ranks.push(prevRank);  
 } else {  
 ranks.push(idx + 1);  
 prevRank = idx + 1;  
 }  
 prevValue = it.value;  
 });  
 return ranks;  
}  
/\*\* branches/row(달성률 등 하나의 지표 행)를 받아 내림차순 순위 막대차트를 만들고, 북서울 지사 막대를 강조 표시한다. \*/  
/\*\* 공용 툴팁: 막대에 마우스를 올리거나 클릭하면 해당 지사의 정확한 달성률(%)을 보여준다. \*/  
function bizTeamEnsureTooltip\_(){  
 let tip = document.getElementById('bizTeamTooltip\_');  
 if (\!tip) {  
 tip = document.createElement('div');  
 tip.id = 'bizTeamTooltip\_';  
 tip.style.cssText = 'position:fixed; z-index:9999; display:none; background:\#152a4a; color:\#fff; font-size:12px; font-weight:700; padding:4px 9px; border-radius:4px; pointer-events:none; white-space:nowrap; box-shadow:0 2px 6px rgba(0,0,0,.25);';  
 document.body.appendChild(tip);  
 // 막대가 아닌 다른 곳을 클릭하면 툴팁을 닫는다(터치/클릭 방식 지원).  
 document.addEventListener('click', function(e){  
 if (\!e.target.closest || \!e.target.closest('.biz-team-bar-row')) bizTeamHideTooltip\_();  
 });  
 }  
 return tip;  
}  
function bizTeamShowTooltip\_(evt, text){  
 const tip = bizTeamEnsureTooltip\_();  
 tip.innerText = text;  
 tip.style.left = (evt.clientX + 14) + 'px';  
 tip.style.top = (evt.clientY + 14) + 'px';  
 tip.style.display = 'block';  
}  
function bizTeamHideTooltip\_(){  
 const tip = document.getElementById('bizTeamTooltip\_');  
 if (tip) tip.style.display = 'none';  
}  
/\*\* renderDashboard()가 innerHTML을 새로 채운 뒤 호출 — 사업팀현황 섹션 막대마다 hover/click 툴팁 이벤트를 연결한다. \*/  
function bizTeamBindBarTooltips\_(){  
 document.querySelectorAll('.biz-team-bar-row').forEach(function(el){  
 const tipText = el.getAttribute('data-tip') || '';  
 el.addEventListener('mouseenter', function(e){ bizTeamShowTooltip\_(e, tipText); });  
 el.addEventListener('mousemove', function(e){ bizTeamShowTooltip\_(e, tipText); });  
 el.addEventListener('mouseleave', bizTeamHideTooltip\_);  
 el.addEventListener('click', function(e){ e.stopPropagation(); bizTeamShowTooltip\_(e, tipText); });  
 });  
}  
/\*\* 유지증가 달성률처럼 마이너스(순감소)와 플러스(순증가)가 모두 나올 수 있는 지표용 — 가운데를 0으로 두고  
 \* 양수는 오른쪽, 음수는 왼쪽으로 뻗어나가는 대칭형(발산형) 막대차트. 마이너스 막대는 채도를 낮춘 색으로 그려  
 \* "마이너스"라는 느낌이 시각적으로 들도록 한다. \*/  
function bizTeamDivergingChartHtml\_(title, branches, row){  
 if (\!row || \!branches.length) {  
 return '\<div class="dash-section" style="flex:1 1 0; min-width:230px;"\>\<div class="dash-section-title"\>\<span\>' + escHtml(title) + '\</span\>\</div\>\<div style="padding:16px; color:\#999; font-size:13px;"\>데이터 없음\</div\>\</div\>';  
 }  
 const items = branches.map(function(b, i){ return { branch: b, value: bizTeamParseNum\_(row.values\[i\]) }; });  
 items.sort(function(a, b){  
 if (b.value \!== a.value) return b.value - a.value;  
 if (a.branch === '북서울') return -1; // 동석차일 때 북서울을 해당 순위 그룹 맨 위로  
 if (b.branch === '북서울') return 1;  
 return 0;  
 });  
 const ranks = bizTeamComputeRanks\_(items); // 동일 값은 동일 순위(1,1,1,4,4,4,4,8식)  
 const maxAbs = Math.max.apply(null, items.map(function(it){ return Math.abs(it.value); }).concat(\[1\]));  
 const myIdx = items.findIndex(function(it){ return it.branch === '북서울'; });  
 const bars = items.map(function(it, idx){  
 const isMine = it.branch === '북서울';  
 const isNeg = it.value \< 0;  
 const halfPct = Math.min(100, (Math.abs(it.value) / maxAbs) \* 100);  
 const posColor = isMine ? '\#c0392b' : '\#4a86e8';  
 const negColor = isMine ? '\#d9a8a3' : '\#b7c1d1'; // 채도를 낮춘 색상 — 마이너스(순감소) 느낌  
 const barColor = isNeg ? negColor : posColor;  
 const tipText = escHtml(it.branch + ': ' + (it.value \> 0 ? '+' : '') + it.value.toFixed(0) + '%');  
 return '\<div class="biz-team-bar-row" data-tip="' + tipText + '" style="display:flex; align-items:center; gap:6px; margin:3px 0; cursor:pointer;"\>' +  
 '\<div style="width:18px; text-align:right; font-size:11px; color:\#888;"\>' + ranks\[idx\] + '\</div\>' +  
 '\<div style="width:56px; font-size:12px; font-weight:' + (isMine ? '700' : '400') + '; color:' + (isMine ? '\#c0392b' : '\#333') + '; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;"\>' + escHtml(it.branch) + '\</div\>' +  
 '\<div style="flex:1; display:flex; height:14px; position:relative;"\>' +  
 '\<div style="width:50%; display:flex; justify-content:flex-end; background:\#eef1f4; overflow:hidden; border-radius:3px 0 0 3px;"\>' +  
 (isNeg ? '\<div style="width:' + halfPct + '%; height:100%; background:' + barColor + ';"\>\</div\>' : '') +  
 '\</div\>' +  
 '\<div style="width:50%; background:\#eef1f4; overflow:hidden; border-radius:0 3px 3px 0;"\>' +  
 (\!isNeg ? '\<div style="width:' + halfPct + '%; height:100%; background:' + barColor + ';"\>\</div\>' : '') +  
 '\</div\>' +  
 '\<div style="position:absolute; left:50%; top:0; bottom:0; width:1px; background:\#8b96a3;"\>\</div\>' +  
 '\</div\>' +  
 '\</div\>';  
 }).join('');  
 const rankLabel = myIdx \>= 0 ? ('북서울 ' + ranks\[myIdx\] + '위/' + items.length) : '';  
 return '\<div class="dash-section" style="flex:1 1 0; min-width:230px;"\>\<div class="dash-section-title"\>\<span\>' + escHtml(title) + '\</span\>' +  
 (rankLabel ? '\<span style="font-size:12px; color:\#c0392b; font-weight:700;"\>' + escHtml(rankLabel) + '\</span\>' : '') +  
 '\</div\>\<div style="padding:8px 4px;"\>' + bars + '\</div\>\</div\>';  
}  
function bizTeamRankChartHtml\_(title, branches, row){  
 if (\!row || \!branches.length) {  
 return '\<div class="dash-section" style="flex:1 1 0; min-width:230px;"\>\<div class="dash-section-title"\>\<span\>' + escHtml(title) + '\</span\>\</div\>\<div style="padding:16px; color:\#999; font-size:13px;"\>데이터 없음\</div\>\</div\>';  
 }  
 const items = branches.map(function(b, i){ return { branch: b, value: bizTeamParseNum\_(row.values\[i\]) }; });  
 items.sort(function(a, b){  
 if (b.value \!== a.value) return b.value - a.value;  
 if (a.branch === '북서울') return -1; // 동석차일 때 북서울을 해당 순위 그룹 맨 위로  
 if (b.branch === '북서울') return 1;  
 return 0;  
 });  
 const ranks = bizTeamComputeRanks\_(items); // 동일 값은 동일 순위(1,1,1,4,4,4,4,8식)  
 const maxVal = Math.max.apply(null, items.map(function(it){ return it.value; }).concat(\[1\]));  
 const myIdx = items.findIndex(function(it){ return it.branch === '북서울'; });  
 const bars = items.map(function(it, idx){  
 const isMine = it.branch === '북서울';  
 const pct = maxVal \> 0 ? Math.max(2, (it.value / maxVal) \* 100) : 0;

 '\</div\>\<div style="padding:8px 4px;"\>' + bars + '\</div\>\</div\>';

function applyEditableListsToClient\_(lists, defaults){  
 if (defaults) SETTINGS\_DEFAULTS = defaults;

 if (lists.영업컨설턴트 && lists.영업컨설턴트.length) {  
 \[LIST\_SALES\_REP, LIST\_CANCEL\_SALES\_REP, LIST\_PRICE\_SALES\_REP, LIST\_RESTART\_SALES\_REP, DASH\_REP\_LIST, REP\_TARGET\_LIST\].forEach(function(arr){  
 arr.length = 0; lists.영업컨설턴트.forEach(function(v){ arr.push(v); });  
 });  
 }  
 if (lists.상품일보\_담당자 && lists.상품일보\_담당자.length) {

// 데이터를 불러오는 동안 회전 스피너 + 가짜(시뮬레이션) 진행률(0\~99%)을 함께 보여준다.  
// Apps Script는 서버 작업의 실제 진행률을 알려주지 않으므로, 시간이 지날수록 점점 느려지며 99%에 가까워지는  
// 방식으로 "진행되고 있다"는 느낌을 준다. 실제 데이터가 도착해 render() 등이 \#content를 통째로 새 내용으로  
// 갈아끼우면 진행률 DOM 요소 자체가 사라지므로, 타이머가 이를 감지하고 스스로 멈춘다(별도 종료 호출 불필요).  
/\*\* 탭 데이터를 불러오는 도중 사용자가 "다시 시도" 버튼을 눌러 같은 데이터를 다시 요청하면,  
 \* 화면에는 새 요청이 진행 중이지만 그 전에 보냈던(응답이 너무 늦게 온) 요청도 구글 서버에서는  
 \* 여전히 실행 중이다. google.script.run은 클라이언트에서 요청을 취소할 방법이 없어서, 오래된 요청이  
 \* 나중에 뒤늦게 응답으로 돌아오면 방금 새로 불러온 최신 화면을 예전 데이터로 덮어써 버릴 수 있다  
 \* ("로딩이 되기도 하고 안 되기도 하고 일관성이 없다"는 증상의 원인 중 하나). 탭/기능별로 "가장 최근에  
 \* 보낸 요청 번호"만 기억해두었다가, 그보다 오래된 요청의 응답은 무시하도록 한다. \*/  
const LOAD\_GEN\_ = {};  
function nextLoadGen\_(key){ LOAD\_GEN\_\[key\] = (LOAD\_GEN\_\[key\] || 0) + 1; return LOAD\_GEN\_\[key\]; }  
function isStaleLoadGen\_(key, gen){ return gen \!== LOAD\_GEN\_\[key\]; }  
  
/\*\* 화면마다 상단 요약표 등 .grid-wrap 위에 오는 내용의 높이가 제각각이라, .grid-wrap에 고정 높이를  
 \* css로만 주면 뷰포트보다 내용이 길어져 페이지 전체 스크롤 + 표 내부 스크롤이 동시에 생기는 "2중 스크롤"이  
 \* 발생한다. 실제로 표가 화면에서 시작하는 위치(getBoundingClientRect)를 기준으로 남은 높이만큼만 표 영역에  
 \* 부여해서, 표 내부 스크롤 하나만 남도록 맞춘다. \*/  
function fitGridWrapToViewport\_(){  
 document.querySelectorAll('.grid-wrap').forEach(function(el){  
 if (el.dataset.noAutoFit) return;  
 const rect = el.getBoundingClientRect();  
 const h = window.innerHeight - rect.top - 12;  
 el.style.height = Math.max(h, 160) + 'px';  
 });  
}  
/\*\* 영업현황 표처럼 헤더가 2줄(rowspan/colspan 혼용)인 표는 모든 th에 공통으로 걸린  
 \* position:sticky; top:0 규칙 때문에 2번째 헤더 줄이 1번째 줄과 같은 위치(top:0)에 들러붙어  
 \* 스크롤 시 "날짜" 등 rowspan 헤더가 그 아래 실제 값을 가리는 것처럼 겹쳐 보이는 문제가 있었다.  
 \* 1번째 헤더 줄의 실제 높이만큼 2번째 줄의 sticky top 값을 내려서 서로 겹치지 않게 맞춘다. \*/  
function fitTwoRowStickyHeader\_(tableSelector){  
 const table = document.querySelector(tableSelector);  
 if (\!table) return;  
 const theadRows = table.querySelectorAll('thead tr');  
 if (theadRows.length \< 2) return;  
 const firstRowHeight = theadRows\[0\].getBoundingClientRect().height;  
 Array.from(theadRows\[1\].children).forEach(function(th){ th.style.top = firstRowHeight + 'px'; });  
}  
window.addEventListener('resize', function(){ fitGridWrapToViewport\_(); fitTwoRowStickyHeader\_('.status-wrap .grid-wrap table'); });  
  
let LOADING\_PROGRESS\_TIMER\_ = null;  
// retryFnName: 약 30초가 지나도 응답이 없을 때 "다시 시도" 버튼에 연결할 전역 함수 이름(문자열).  
// 서버(Apps Script) 응답이 간헐적으로 오지 않는 경우, 화면이 영구히 "불러오는 중"에 멈춰 있지 않도록  
// 안내 메시지 + 재시도 버튼으로 전환한다.  
function showLoadingProgress\_(elId, text, retryFnName){  
 if (LOADING\_PROGRESS\_TIMER\_) { clearInterval(LOADING\_PROGRESS\_TIMER\_); LOADING\_PROGRESS\_TIMER\_ = null; }  
 const el = document.getElementById(elId);  
 if (\!el) return;  
 el.innerHTML = '\<div class="loading loading-spin"\>' +  
 '\<div class="loading-text"\>' + text + '\</div\>' +  
 '\<div class="loading-progress-track"\>\<div class="loading-progress-fill" id="loadingProgressFill\_"\>\</div\>\</div\>' +  
 '\<div class="loading-progress-pct" id="loadingProgressPct\_"\>0%\</div\>' +  
 '\</div\>';  
 let pct = 0, ticks = 0;  
 LOADING\_PROGRESS\_TIMER\_ = setInterval(function(){  
 ticks++;  
 const fill = document.getElementById('loadingProgressFill\_');  
 const lbl = document.getElementById('loadingProgressPct\_');  
 if (\!fill || \!lbl) { clearInterval(LOADING\_PROGRESS\_TIMER\_); LOADING\_PROGRESS\_TIMER\_ = null; return; }  
 pct += (99 - pct) \* 0.12 + 0.3;  
 if (pct \> 99) pct = 99;  
 fill.style.width = pct + '%';  
 lbl.innerText = Math.round(pct) + '%';  
 if (ticks \> 150) { // 약 30초 동안 응답이 없으면 지연 안내 + 재시도 버튼으로 전환  
 clearInterval(LOADING\_PROGRESS\_TIMER\_); LOADING\_PROGRESS\_TIMER\_ = null;  
 const el2 = document.getElementById(elId);  
 if (el2) {  
 el2.innerHTML = '\<div class="loading" style="text-align:center; padding:24px 0;"\>' +  
 '\<div style="color:\#c0392b; font-weight:600; margin-bottom:8px; font-size:14px;"\>서버 응답이 지연되고 있습니다.\</div\>' +  
 '\<div style="color:\#888; font-size:12px; margin-bottom:14px;"\>네트워크 상태를 확인해 주시거나 아래 버튼으로 다시 시도해 주세요.\</div\>' +  
 (retryFnName ? ('\<button class="primary" onclick="' + retryFnName + '()"\>다시 시도\</button\>') : '') +  
 '\</div\>';  
 }  
 }  
 }, 200);  
}

/\* ===================== 정렬 ===================== \*/  
function sortedRows(){  
 const filterText = (document.getElementById('searchBox')||{}).value || '';  
 const repFilter = (document.getElementById('repFilterOrder')||{}).value || '';  
 let list = ROWS.map(r =\> Object.assign({}, r, computeAutoFields(r)));  
 if (filterText) {  
 list = list.filter(r =\> String(r.계약처명||'').includes(filterText) || String(r.계약번호||'').includes(filterText));  
 }  
 if (repFilter) list = list.filter(r =\> r.영업담당 === repFilter);  
 if (chkVal('onlyUnstartedOrder', true)) list = list.filter(r =\> r.구분 === '미개시');  
 const key = sortState.key, dir = sortState.dir === 'asc' ? 1 : -1;  
 list.sort((a,b) =\> {  
 let va = a\[key\], vb = b\[key\];  
 const blankA = va === '' || va === null || va === undefined;  
 const blankB = vb === '' || vb === null || vb === undefined;  
 if (blankA && blankB) return 0;  
 if (blankA) return 1; // 빈 값은 항상 마지막  
 if (blankB) return -1;  
 if (key === '용역료') { va = Number(va); vb = Number(vb); }  
 if (va \< vb) return -1 \* dir;  
 if (va \> vb) return 1 \* dir;  
 return 0;  
 });  
 return list;  
}  
  
function setSort(key){  
 if (sortState.key === key) sortState.dir = sortState.dir === 'asc' ? 'desc' : 'asc';  
 else { sortState.key = key; sortState.dir = 'asc'; }  
 render();  
}  
  
/\* ===================== 그리드 렌더 ===================== \*/  
function headerCell(h){  
 const arrow = sortState.key === h ? (sortState.dir === 'asc' ? '▲' : '▼') : '';  
 const sw = localStorage.getItem('colw\_order\_' + h);  
 const style = sw ? \` style="width:${sw}px; min-width:${sw}px;"\` : '';  
 return \`\<th${style} onclick="setSort('${h}')"\>${h}\<span class="arrow"\>${arrow}\</span\>\<div class="col-resizer" onclick="event.stopPropagation()" onmousedown="initColResize(event, 'order', '${h}')"\>\</div\>\</th\>\`;  
}  
  
const ORDER\_DATE\_FIELDS = \['보고일','계약일','개시일','기산일'\];  
const ORDER\_MONTH\_FIELDS = \['수주월','개시월'\];  
  
function orderCellClass(row, field, val, allRows){  
 let cls = '';  
 if (field === '계약번호') cls = 'contract-cell' + (contractCellBad(val, allRows, '계약번호') ? ' contract-bad' : '');  
 else if (field === '계약처명') cls = 'name-cell';  
 else if (field === '용역료') cls = 'fee money num';  
 else if (field === '담당차량') cls = 'center center-cell narrow';  
 else if (ORDER\_DATE\_FIELDS.indexOf(field) \!== -1) cls = 'datecol';  
 else if (field === '비고') cls = 'wide-note';  
 if (field === '그로스' && String(val) === '법인') cls += ' gross-corp';  
 if (field === '상품' && String(val) === '정보보안') cls += ' prod-sec';  
 if (\['개시일','기산일'\].indexOf(field) \!== -1 && String(val) === todayStr()) cls += ' today-hl';  
 else if (sortState.key === field) cls += ' sort-col';  
 return cls.trim();  
}  
  
function fieldCellHtml(row, field, allRows){  
 const val = row\[field\] \!== undefined && row\[field\] \!== null ? row\[field\] : '';  
 let cls = orderCellClass(row, field, val, allRows);  
 let disp;  
 const isDateField = ORDER\_DATE\_FIELDS.indexOf(field) \!== -1;  
 if (field === '용역료') disp = commaFmt(val);  
 else if (isDateField) disp = fmtMD(val);  
 else disp = val;  
 const titleAttr = (field === '계약처명' || field === '비고' || isDateField) ? \` title="${escAttr(val)}"\` : '';  
 // 수정권한 없는 사용자도 날짜만은 클릭 → 팝업으로 고칠 수 있게 함(요청: 화면에서 직접 수정하는 게 아니라 팝업으로).  
 if (isDateField) {  
 cls += ' date-editable';  
 return \`\<td class="${cls}"${titleAttr} data-scope="order" data-id="${escAttr(row.id)}" data-field="${escAttr(field)}" data-val="${escAttr(val)}" onclick="openDateEditPopup\_(this)"\>${escHtml(disp)}\</td\>\`;  
 }  
 return \`\<td class="${cls}"${titleAttr}\>${escHtml(disp)}\</td\>\`;  
}  
  
function render(){  
 const rows = sortedRows();  
  
 let html = '\<div class="grid-wrap"\>\<table\>\<thead\>\<tr\>' + flagHeaderHtml();  
 HEADERS.forEach(h =\> html += headerCell(h));  
 html += '\</tr\>\</thead\>\<tbody\>';  
  
 rows.forEach(row =\> {  
 const rowCls = ((row.\_syncError ? 'sync-error' : (row.\_unsynced ? 'unsynced' : '')) + flagRowClass('order', row.id)).trim();  
 html += \`\<tr data-id="${row.id}" class="${rowCls}"\>\` + flagCellHtml('order', row.id);  
 HEADERS.forEach(h =\> {  
 if (AUTO\_FIELDS.includes(h)) {  
 const isMonth = ORDER\_MONTH\_FIELDS.indexOf(h) \!== -1;  
 const disp = isMonth ? fmtMonth(row\[h\]) : row\[h\];  
 const autoCls = ('auto ' + statusClass(row\[h\]) + (isMonth ? ' monthcol' : '') + (sortState.key === h ? ' sort-col' : '')).trim();  
 html += \`\<td class="${autoCls}"\>${escHtml(disp)}\</td\>\`;  
 } else {  
 html += fieldCellHtml(row, h, rows);  
 }  
 });  
 html += '\</tr\>';  
 });  
  
 html += '\</tbody\>\</table\>\</div\>';  
 document.getElementById('content').innerHTML = html;  
 document.getElementById('rowCount').innerText = \`총 ${rows.length}건\`;  
 document.getElementById('rowSumOrder').innerText = flaggedSumText\_(rows, '용역료');  
 updateCopyButtonState\_('order', rows);  
}

function onFieldChange(id, field, value){  
 const row = ROWS.find(r =\> r.id === id);  
 if (\!row) return;  
 row\[field\] = value;  
 row.\_unsynced = true;  
 row.\_syncError = false;  
 render();  
 pushSave(row);  
}  
  
function pushSave(row){  
 setSyncStatus('saving');  
 const fields = {};  
 EDITABLE\_FIELDS.forEach(f =\> fields\[f\] = row\[f\] \!== undefined ? row\[f\] : '');  
 google.script.run  
 .withSuccessHandler(function(res){  
 if (res && res.success) {  
 row.\_unsynced = false;  
 row.\_syncError = false;  
 setSyncStatus('ok');  
 } else {  
 row.\_syncError = true;  
 setSyncStatus('error', res && res.error);  
 handleSessionExpiry(res);  
 }  
 render();  
 })  
 .withFailureHandler(function(err){  
 row.\_syncError = true;  
 setSyncStatus('error', err);  
 render();  
 })  
 .saveOrderStartRow(SESSION.token, { id: row.id, fields: fields });  
}  
  
function retrySave(id){  
 const row = ROWS.find(r =\> r.id === id);  
 if (row) pushSave(row);  
}  
  
function setSyncStatus(state, msg){  
 const el = document.getElementById('syncStatus');  
 el.className = 'sync-status ' + state;  
 el.innerText = state === 'saving' ? '통신 중...' : (state === 'error' ? '서버 미연결' : '서버 연결');  
 if (msg) el.title = state === 'error' ? '클릭하여 서버 재연결 시도 (' + String(msg) + ')' : '';  
}  
function retryAllSync(){  
 const el = document.getElementById('syncStatus');  
 if(el.className.includes('ok') || el.className.includes('saving')) return;  
   
// 저장 중 통신이 끊겨 에러가 난 데이터가 있으면 다시 저장 시도  
 let hasError = false;  
 if (typeof ROWS \!== 'undefined') ROWS.filter(r =\> r.\_syncError).forEach(r =\> { hasError = true; pushSave(r); });  
 if (typeof CANCEL\_ROWS \!== 'undefined') CANCEL\_ROWS.filter(r =\> r.\_syncError).forEach(r =\> { hasError = true; pushSaveCancel(r); });  
 if (typeof PRICE\_ROWS \!== 'undefined') PRICE\_ROWS.filter(r =\> r.\_syncError).forEach(r =\> { hasError = true; pushSavePrice(r); });  
 if (typeof RESTART\_ROWS \!== 'undefined') RESTART\_ROWS.filter(r =\> r.\_syncError).forEach(r =\> { hasError = true; pushSaveRestart(r); });  
   
// 에러난 데이터가 없는데 미연결 상태면 현재 탭 데이터 새로고침  
 if(\!hasError) {  
 if(currentTab === 'order\_start') loadData();  
 else if(currentTab === 'cancel') loadCancelData();  
 else if(currentTab === 'price\_change') loadPriceData();  
 else if(currentTab === 'restart') loadRestartData();  
 }  
}  
  
/\* ===================== 삭제 ===================== \*/  
function deleteRow(id){  
 if (\!confirm('이 건을 삭제하시겠습니까? 삭제하면 복구할 수 없습니다.')) return;  
 const idx = ROWS.findIndex(r =\> r.id === id);  
 if (idx === -1) return;  
 const removed = ROWS\[idx\];  
 ROWS.splice(idx, 1);  
 render();  
 setSyncStatus('saving');  
 google.script.run  
 .withSuccessHandler(function(res){  
 if (res && res.success) {  
 setSyncStatus('ok');  
 } else {  
 ROWS.splice(idx, 0, removed);  
 setSyncStatus('error', res && res.error);  
 render();  
 alert('삭제 실패: ' + (res && res.error ? res.error : '알 수 없는 오류'));  
 }  
 })  
 .withFailureHandler(function(err){  
 ROWS.splice(idx, 0, removed);  
 setSyncStatus('error', err);  
 render();  
 alert('삭제 실패: ' + err);  
 })  
 .deleteOrderStartRow(SESSION.token, id);  
}

function validateRow(row){  
 let ok = true;  
 clearErrors();  
 if (row.계약번호 && \!(row.계약번호 === 'N' || /^Nd{7,8}$/.test(row.계약번호))) { setError('계약번호','N 단독 또는 N+숫자 7\~8자리로 입력하세요.'); ok = false; }  
 if (\!row.계약번호) { setError('계약번호','필수 입력입니다.'); ok = false; }  
 if (\!row.계약처명) { setError('계약처명','필수 입력입니다.'); ok = false; }  
 if (\!row.보고일) { setError('보고일','필수 입력입니다.'); ok = false; }  
 if (row.계약일) {  
 if (row.보고일 && row.계약일 \< row.보고일) { setError('계약일','보고일과 같거나 이후 날짜만 가능합니다.'); ok = false; }  
 else if (isBlockedDate(row.계약일)) { setError('계약일','토·일·공휴일은 입력할 수 없습니다.'); ok = false; }  
 }  
 if (row.개시일) {  
 if (row.계약일 && row.개시일 \< row.계약일) { setError('개시일','계약일 포함 이후 날짜만 가능합니다.'); ok = false; }  
 else if (isBlockedDate(row.개시일)) { setError('개시일','토·일·공휴일은 입력할 수 없습니다.'); ok = false; }  
 }  
 if (row.기산일 && row.기산일 \!== '미정') {  
 if (\!/^d{4}-d{2}-d{2}$/.test(row.기산일)) { setError('기산일','YYYY-MM-DD 형식이거나 "미정"만 입력 가능합니다.'); ok = false; }  
 else if (row.개시일 && row.기산일 \< row.개시일) { setError('기산일','개시일 포함 이후 날짜만 가능합니다.'); ok = false; }  
 else if (isBlockedDate(row.기산일)) { setError('기산일','토·일·공휴일은 입력할 수 없습니다.'); ok = false; }  
 }  
 return ok;  
}

function computeAutoCancel(row){  
 const today = todayStr();  
 if (\!row.접수일) return { 구분:'', 기준:'', 해약월:'' };

 if (chkVal('onlyPendingCancel', true)) list = list.filter(r =\> isPendingDate(r.확정일));  
 const key = cancelSortState.key, dir = cancelSortState.dir === 'asc' ? 1 : -1;  
 list.sort((a,b) =\> {  
 let va = a\[key\], vb = b\[key\];  
 const blankA = va === '' || va === null || va === undefined;  
 const blankB = vb === '' || vb === null || vb === undefined;  
 if (blankA && blankB) return 0;  
 if (blankA) return 1;  
 if (blankB) return -1;  
 if (key === '용역료') { va = Number(va); vb = Number(vb); }  
 if (va \< vb) return -1 \* dir;  
 if (va \> vb) return 1 \* dir;  
 return 0;  
 });

function computeAutoPrice(row){  
 const today = todayStr();  
 const amount = row.금액 === '' || row.금액 === undefined || row.금액 === null ? null : Number(row.금액);  
 if (amount === null || isNaN(amount)) return { 구분:'', 기준:'', 반영월:'', 인상인하율:'' };  
 const 구분 = amount \< 0 ? '인하' : '인상';  
 let 기준, 반영월;  
 const 기산일 = row.기산일;  
 if (기산일 === '미정') { 기준 = '미정'; 반영월 = '미정'; }  
 else if (\!기산일) { 기준 = ''; 반영월 = ''; }  
 else {  
 const ym = yyyymm(기산일);  
 기준 = (ym === yyyymm(today)) ? '당월' : '이월';  
 반영월 = ym;  
 }  
 const before = Number(row.現용역료);  
 const 인상인하율 = (row.現용역료 && before \!== 0 && \!isNaN(before)) ? ((amount / before \* 100).toFixed(1) + '%') : '';  
 return { 구분, 기준, 반영월, 인상인하율 };  
}

 return '';  
}

 PRICE\_HEADERS.forEach((h,i) =\> obj\[h\] = r\[i\]);  
 return obj;  
 });  
 SCOPE\_LOADED\_.price = true;  
 STALE\_SCOPES\_.delete('price'); updateManualRefreshBtn\_();  
 if (\!silent) ensureUserNames(renderPrice);  
 })  
 .withFailureHandler(function(err){ if (\!silent) { setLoadingCursor(false); document.getElementById('content').innerHTML = '\<div class="loading"\>데이터 로드 실패: ' + err + '\</div\>'; } })  
 .getPriceData(SESSION.token, yearMonth);

function sortedPriceRows(){  
 const filterText = (document.getElementById('priceSearchBox')||{}).value || '';  
 const repFilter = (document.getElementById('repFilterPrice')||{}).value || '';  
 const typeFilterEl = document.querySelector('input\[name="priceTypeFilter"\]:checked');  
 const typeFilter = typeFilterEl ? typeFilterEl.value : '';  
 let list = PRICE\_ROWS.map(r =\> Object.assign({}, r, computeAutoPrice(r)));  
 if (filterText) list = list.filter(r =\> String(r.계약처명||'').includes(filterText) || String(r.계약번호||'').includes(filterText));  
 if (repFilter) list = list.filter(r =\> r.영업담당 === repFilter);  
 if (typeFilter) list = list.filter(r =\> r.구분 === typeFilter);  
 if (chkVal('onlyPendingPrice', true)) list = list.filter(r =\> isPendingDate(r.기산일));  
 const key = priceSortState.key, dir = priceSortState.dir === 'asc' ? 1 : -1;  
 list.sort((a,b) =\> {  
 let va = a\[key\], vb = b\[key\];  
 const blankA = va === '' || va === null || va === undefined;  
 const blankB = vb === '' || vb === null || vb === undefined;  
 if (blankA && blankB) return 0;  
 if (blankA) return 1;  
 if (blankB) return -1;  
 if (key === '금액' || key === '現용역료') { va = Number(va); vb = Number(vb); }  
 if (va \< vb) return -1 \* dir;  
 if (va \> vb) return 1 \* dir;  
 return 0;  
 });  
 return list;  
}  
function setPriceSort(key){  
 if (priceSortState.key === key) priceSortState.dir = priceSortState.dir === 'asc' ? 'desc' : 'asc';  
 else { priceSortState.key = key; priceSortState.dir = 'asc'; }  
 renderPrice();  
}  
function headerCellPrice(h){  
 const arrow = priceSortState.key === h ? (priceSortState.dir === 'asc' ? '▲' : '▼') : '';  
 const sw = localStorage.getItem('colw\_price\_' + h);  
 const style = sw ? \` style="width:${sw}px; min-width:${sw}px;"\` : '';  
 return \`\<th${style} onclick="setPriceSort('${h}')"\>${h}\<span class="arrow"\>${arrow}\</span\>\<div class="col-resizer" onclick="event.stopPropagation()" onmousedown="initColResize(event, 'price', '${h}')"\>\</div\>\</th\>\`;  
}  
const PRICE\_DATE\_FIELDS = \['접수일','기산일'\];  
  
function priceCellClass(field, val, allRows){  
 let cls = '';  
 if (field === '계약번호') cls = 'contract-cell' + (contractCellBad(val, allRows, '계약번호') ? ' contract-bad' : '');  
 else if (field === '계약처명') cls = 'name-cell';  
 else if (field === '비고') cls = 'wide-note';  
 else if (field === '現용역료') cls = 'money-black num';  
 else if (field === '담당차량') cls = 'center center-cell narrow';  
 else if (field === '금액') {  
 const n = Number(val);  
 const up = (\!isNaN(n) && val \!== '') ? (n \>= 0) : null;  
 cls = up === null ? 'money num' : (up ? 'amt-up pcbg-up num' : 'amt-down pcbg-down num');  
 }  
 if (PRICE\_DATE\_FIELDS.indexOf(field) \!== -1) cls += ' datecol';  
 if (field === '그로스' && String(val) === '법인') cls += ' gross-corp';  
 if (field === '상품' && String(val) === '정보보안') cls += ' prod-sec';  
 if (field === '기산일' && String(val) === todayStr()) cls += ' today-hl';  
 else if (priceSortState.key === field) cls += ' sort-col';  
 return cls.trim();  
}  
  
function fieldCellHtmlPrice(row, field, allRows){  
 const val = row\[field\] \!== undefined && row\[field\] \!== null ? row\[field\] : '';  
 let cls = priceCellClass(field, val, allRows);  
 let disp;  
 const isDateField = PRICE\_DATE\_FIELDS.indexOf(field) \!== -1;  
 if (field === '금액' || field === '現용역료') disp = commaFmt(val);  
 else if (isDateField) disp = fmtMD(val);  
 else disp = val;  
 const titleAttr = (field === '계약처명' || field === '비고' || field === '사유' || isDateField) ? \` title="${escAttr(val)}"\` : '';  
 if (isDateField) {  
 cls += ' date-editable';  
 return \`\<td class="${cls}"${titleAttr} data-scope="price" data-id="${escAttr(row.id)}" data-field="${escAttr(field)}" data-val="${escAttr(val)}" onclick="openDateEditPopup\_(this)"\>${escHtml(disp)}\</td\>\`;  
 }  
 return \`\<td class="${cls}"${titleAttr}\>${escHtml(disp)}\</td\>\`;  
}  
  
function priceAutoCellHtml(row, h){  
 const val = row\[h\] \!== undefined && row\[h\] \!== null ? row\[h\] : '';  
 const 구분 = row.구분 || '';  
 let cls = 'auto ' + statusClassPrice(h, val);  
 let disp = val;  
 if (h === '반영월') { disp = fmtMonth(val); cls += ' monthcol'; }  
 if (h === '구분' && 구분) cls += (구분 === '인상' ? ' pc-up' : ' pc-down');  
 if (h === '인상인하율' && 구분) cls += (구분 === '인상' ? ' rate-up' : ' rate-down');  
 if (priceSortState.key === h) cls += ' sort-col';  
 return \`\<td class="${cls.trim()}"\>${escHtml(disp)}\</td\>\`;  
}  
  
function renderPrice(){  
 const rows = sortedPriceRows();  
 let html = '\<div class="grid-wrap"\>\<table\>\<thead\>\<tr\>' + flagHeaderHtml();  
 PRICE\_HEADERS.forEach(h =\> html += headerCellPrice(h));  
 html += '\</tr\>\</thead\>\<tbody\>';  
 rows.forEach(row =\> {  
 const rowCls = ((row.\_syncError ? 'sync-error' : (row.\_unsynced ? 'unsynced' : '')) + flagRowClass('price', row.id)).trim();  
 html += \`\<tr data-id="${row.id}" class="${rowCls}"\>\` + flagCellHtml('price', row.id);  
 PRICE\_HEADERS.forEach(h =\> {  
 if (PRICE\_AUTO\_FIELDS.includes(h)) html += priceAutoCellHtml(row, h);  
 else html += fieldCellHtmlPrice(row, h, rows);  
 });  
 html += '\</tr\>';  
 });  
 html += '\</tbody\>\</table\>\</div\>';  
 document.getElementById('content').innerHTML = html;  
 document.getElementById('priceRowCount').innerText = \`총 ${rows.length}건\`;  
 document.getElementById('rowSumPrice').innerText = flaggedSumText\_(rows, '금액');  
 updateCopyButtonState\_('price', rows);  
}

function deletePriceGridRow(id){

 if (row.기산일 && row.기산일 \!== '미정') {

function sortedRestartRows(){  
 const filterText = (document.getElementById('restartSearchBox')||{}).value || '';  
 const repFilter = (document.getElementById('repFilterRestart')||{}).value || '';  
 let list = RESTART\_ROWS.map(r =\> Object.assign({}, r, computeAutoRestart(r)));  
 if (filterText) list = list.filter(r =\> String(r.계약처명||'').includes(filterText) || String(r.계약번호||'').includes(filterText));  
 if (repFilter) list = list.filter(r =\> r.영업담당 === repFilter);  
 if (chkVal('onlyStoppedRestart', true)) list = list.filter(r =\> String(r.현상태||'') === '중지');  
 const key = restartSortState.key, dir = restartSortState.dir === 'asc' ? 1 : -1;  
 list.sort((a,b) =\> {  
 let va = a\[key\], vb = b\[key\];  
 const blankA = va === '' || va === null || va === undefined;  
 const blankB = vb === '' || vb === null || vb === undefined;  
 if (blankA && blankB) return 0;  
 if (blankA) return 1;  
 if (blankB) return -1;  
 if (key === '용역료') { va = Number(va); vb = Number(vb); }  
 if (va \< vb) return -1 \* dir;  
 if (va \> vb) return 1 \* dir;

 list.sort((a,b) =\> {

/\*\* 떠있는 창(.float-win) 제목줄을 마우스로 눌러 끌면 창이 그 위치로 따라 움직인다. (Admin.html과 동일) \*/  
(function initFloatWinDrag\_(){  
 let dragEl = null, offX = 0, offY = 0;  
 document.addEventListener('mousedown', function(e){  
 const bar = e.target.closest && e.target.closest('.float-win-title');  
 if (\!bar) return;  
 const win = bar.closest('.float-win');  
 if (\!win) return;  
 dragEl = win;  
 const rect = win.getBoundingClientRect();  
 offX = e.clientX - rect.left;  
 offY = e.clientY - rect.top;  
 win.style.right = 'auto';  
 win.style.left = rect.left + 'px';  
 win.style.top = rect.top + 'px';  
 e.preventDefault();  
 });  
 document.addEventListener('mousemove', function(e){  
 if (\!dragEl) return;  
 const maxLeft = window.innerWidth - 60, maxTop = window.innerHeight - 40;  
 dragEl.style.left = Math.min(Math.max(0, e.clientX - offX), maxLeft) + 'px';  
 dragEl.style.top = Math.min(Math.max(0, e.clientY - offY), maxTop) + 'px';  
 });  
 document.addEventListener('mouseup', function(){ dragEl = null; });  
})();

function pctVs\_(actual, base){
