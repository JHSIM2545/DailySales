function renderSalesStatus(){  
 const \[y, m\] = statusYearMonth.split('-').map(Number);  
 const rows = STATUS\_DATA || \[\];  
 const filterOptions = \['일반알람', '알람+휴엔', '정보보안'\];  
  
 // 영업컨설턴트별 차트 HTML 생성 로직  
 const reps = REP\_TARGET\_LIST;  
  
 // 컨설턴트별 고정 컬러 (차트 종류와 상관없이 항상 동일 인물 = 동일 색상)  
 const REP\_COLORS = { '최영국': '\#2563eb', '이수열': '\#16a34a', '박광춘': '\#8b4513', '정문재': '\#7c3aed', '임영민': '\#f97316' };  
  
 // 값이 목표 대비 100%를 넘으면, 실제 최대값을 넘는 다음 100 단위까지 축을 유동적으로 확장 (예: 230% -\> 300%, 310% -\> 400%)  
 function gaugeAxisMax\_(pctList) {  
 const maxAbs = Math.max(0, ...pctList.map(p =\> Math.abs(p)));  
 return maxAbs \<= 100 ? 100 : Math.ceil(maxAbs / 100) \* 100;  
 }  
  
 // 달성률은 지사 목표를 인원수로 균등 분배한 값이 아니라, "컨설턴트별 목표 입력" 탭에서 부여한  
 // 개인별 목표(repTargetFor\_)를 그대로 사용한다(담당자마다 값이 다를 수 있음).  
 const gaugeMetrics = \[  
 { key: '수주' },  
 { key: '개시' },  
 { key: '유지감소' }  
 \];  
  
 let chartHtml = '\<div class="chart-grid"\>';  
  
 // 1) 수주/개시/유지감소: 컨설턴트별 색상 게이지 + 100% 초과 시 축 자동 확장 (담당자별로 부여된 개인 목표 사용)  
 gaugeMetrics.forEach(m =\> {  
 const pctList = reps.map(rep =\> {  
 const val = (STATUS\_REP\_METRICS && STATUS\_REP\_METRICS\[rep\] && STATUS\_REP\_METRICS\[rep\]\[m.key\]) || 0;  
 const tgt = repTargetFor\_(rep, m.key);  
 return tgt \!== 0 ? (val / tgt) \* 100 : 0;  
 });  
 const axisMax = gaugeAxisMax\_(pctList);  
 const targetSum = reps.reduce((s, rep) =\> s + repTargetFor\_(rep, m.key), 0);  
  
 chartHtml += \`\<div class="chart-card"\>  
 \<div class="chart-card-title"\>\<span\>${m.key}\</span\> \<span style="font-weight:normal; color:\#888;"\>목표(개인 합계): ${fmtK(targetSum)}${axisMax \> 100 ? \` (0\~${axisMax}% 표시)\` : ''}\</span\>\</div\>\`;  
 reps.forEach((rep, idx) =\> {  
 const val = (STATUS\_REP\_METRICS && STATUS\_REP\_METRICS\[rep\] && STATUS\_REP\_METRICS\[rep\]\[m.key\]) || 0;  
 const tgt = repTargetFor\_(rep, m.key);  
 const pct = Math.round(pctList\[idx\]);  
 const barWidth = Math.min(Math.max((pct / axisMax) \* 100, 0), 100);  
 const color = REP\_COLORS\[rep\] || '\#888';  
  
 chartHtml += \`\<div class="bar-row" title="실적: ${fmtK(val)} / 목표: ${fmtK(tgt)}"\>  
 \<div class="bar-name"\>${rep}\</div\>  
 \<div class="bar-track"\>\<div class="bar-fill" style="width: ${barWidth}%; background: ${color};"\>\</div\>\</div\>  
 \<div class="bar-pct"\>${pct}%\</div\>  
 \</div\>\`;  
 });  
 chartHtml += \`\</div\>\`;  
 });  
  
 // 2) 유지증가: 0을 중심에 두고 양수는 오른쪽/음수는 왼쪽으로 뻗는 발산형 차트. 음수는 채도를 낮춰 양수와 구분. (담당자별 개인 목표 사용)  
 {  
 const incPctList = reps.map(rep =\> {  
 const val = (STATUS\_REP\_METRICS && STATUS\_REP\_METRICS\[rep\] && STATUS\_REP\_METRICS\[rep\]\['유지증가'\]) || 0;  
 const tgt = repTargetFor\_(rep, '유지증가');  
 return tgt \!== 0 ? (val / tgt) \* 100 : 0;  
 });  
 const incAxisMax = gaugeAxisMax\_(incPctList);  
 const incTargetSum = reps.reduce((s, rep) =\> s + repTargetFor\_(rep, '유지증가'), 0);  
  
 chartHtml += \`\<div class="chart-card"\>  
 \<div class="chart-card-title"\>\<span\>유지증가\</span\> \<span style="font-weight:normal; color:\#888;"\>목표(개인 합계): ${fmtK(incTargetSum)}${incAxisMax \> 100 ? \` (0\~±${incAxisMax}% 표시)\` : ''}\</span\>\</div\>\`;  
 reps.forEach((rep, idx) =\> {  
 const val = (STATUS\_REP\_METRICS && STATUS\_REP\_METRICS\[rep\] && STATUS\_REP\_METRICS\[rep\]\['유지증가'\]) || 0;  
 const tgt = repTargetFor\_(rep, '유지증가');  
 const pct = Math.round(incPctList\[idx\]);  
 const half = Math.min(Math.abs(pct) / incAxisMax \* 50, 50);  
 const color = REP\_COLORS\[rep\] || '\#888';  
 const isNeg = pct \< 0;  
 const fillStyle = isNeg  
 ? \`left: ${(50 - half)}%; width: ${half}%; background: ${color}; filter: saturate(35%);\`  
 : \`left: 50%; width: ${half}%; background: ${color};\`;  
  
 chartHtml += \`\<div class="bar-row" title="실적: ${fmtK(val)} / 목표: ${fmtK(tgt)}"\>  
 \<div class="bar-name"\>${rep}\</div\>  
 \<div class="bar-track bipolar"\>\<span class="zero-line"\>\</span\>\<div class="bar-fill bipolar-fill" style="${fillStyle}"\>\</div\>\</div\>  
 \<div class="bar-pct"\>${pct}%\</div\>  
 \</div\>\`;  
 });  
 chartHtml += \`\</div\>\`;  
 }  
  
 chartHtml += '\</div\>';

 FULL\_REPORT\_MODE = null;  
 FULL\_REPORT\_TEXT\_EDITED = false;

function dailyAchieve(cum, target){  
 if (\!target) return 0;  
 return Math.round((cum / target) \* 100); // 소수점 없이 반올림

function effectiveDailyItem(product, forecastOrders){  
 const it = (DAILY\_REPORT\_DATA && DAILY\_REPORT\_DATA\[product\]) || {};  
 if (forecastOrders && forecastOrders\[product\] \!= null) {

 return Object.assign({}, it, { 수주\_당일: forecastToday, 수주\_누계: prev + forecastToday });  
 }  
 return it;  
}

/\*\* 통합 TEXT 보고(직접수정 가능 박스) 생성: 1\~4 상품군은 자동집계 실적, 5\~6은 안전상품/AI도어캠 실적 데이터를 사용.  
 \* Index.html은 조회 전용이라 전망/마감 모두 실제 자동집계 데이터를 그대로 사용함(예상치 입력 기능 없음). \*/  
function buildFullDailyReportText(mode){  
 const modeLabel = fullReportModeLabel\_(mode);  
 const forecastOrders = (mode === '전망') ? DAILY\_FORECAST\_ORDERS : null;  
 const parts = String(dailyReportDate).split('-');  
 const month = Number(parts\[1\]) || 0, day = Number(parts\[2\]) || 0;  
 const lines = \[\];  
 lines.push('\[북서울지사\] ' + month + '月 ' + day + '日 ' + modeLabel);  
 lines.push('');  
 DAILY\_REPORT\_SECTIONS.forEach(function(sec){  
 const it = effectiveDailyItem(sec.product, forecastOrders);  
 lines.push(sec.heading);  
 DAILY\_REPORT\_METRICS.forEach(function(m){  
 const target = Math.round(Number(it\['목표\_' + m.key\]) || 0);  
 const today = Math.round(Number(it\[m.key + '\_당일'\]) || 0);  
 const prev = Number(it\[m.key + '\_전일누계'\]) || 0;  
 const cum = Math.round(prev + today);  
 const rate = target ? Math.round((cum / target) \* 100) : 0;  
   
// \[수정\] sec.product가 '알람'이고 m.key가 '수주'일 때만 (도전비 10%UP) 적용  
 const extraLabel = (sec.product === '알람' && m.key === '수주') ? ' (도전비 10%UP)' : '';  
   
lines.push('□ ' + m.label + ' \* 목표 ' + fmtK(target) + '천원' + extraLabel);  
 lines.push('- 당일 : ' + fmtK(today) + '천원 / 누계 : ' + fmtK(cum) + '천원(' + rate + '%)');  
 });  
 lines.push('');  
 });  
 FULL\_REPORT\_EXTRA\_SECTIONS.forEach(function(sec){  
 lines.push(sec.heading);  
 if (sec.groupKey === '안전상품') {  
 // 안전상품은 상품일보 기반 자동집계(SAFETY\_SUMMARY\_DAILY)만 유지되며, 예전 수동입력 시트(EXTRA\_PRODUCT\_DATA)는 더 이상 갱신되지 않아  
 // 그 값을 그대로 쓰면 항상 0으로 나온다. 또한 이 값은 "당일" 구분 없이 월 누계(자력 기준)만 제공된다.  
 // 목표는 전체(자력+전략협력) 목표이며 자력 목표는 그 절반이므로, 자력 실적은 목표의 50%를 기준으로 달성률을 계산한다.  
 const s = SAFETY\_SUMMARY\_DAILY || {};  
 const tgt = s.목표 || {}, act = s.실적 || {};  
 sec.metrics.forEach(function(m){  
 const target = Math.round(Number(tgt\[m.key\]) || 0);  
 const cum = Math.round(Number(act\[m.key\]) || 0);  
 const today = Math.round(Number(act\[m.key + '\_당일'\]) || 0);  
 const rate = target ? Math.round((cum / target) \* 100) : 0;  
 lines.push('□ ' + m.label + ' \* 목표 ' + fmtFullReportNum\_(target, m.unit) + m.unit);  
 lines.push('- 당일 : ' + fmtFullReportNum\_(today, m.unit) + m.unit + ' / 누계 : ' + fmtFullReportNum\_(cum, m.unit) + m.unit + '(' + rate + '%)');  
 });  
 lines.push('');  
 return;  
 }  
 const group = (EXTRA\_PRODUCT\_DATA && EXTRA\_PRODUCT\_DATA\[sec.groupKey\]) || {};  
 sec.metrics.forEach(function(m){  
 const it = group\[m.key\] || {};  
 const target = Math.round(Number(it.목표) || 0);  
 const today = Math.round(Number(it.당일) || 0);  
 const prev = Number(it.전일누계) || 0;  
 const cum = Math.round(prev + today);  
 const rate = target ? Math.round((cum / target) \* 100) : 0;  
 lines.push('□ ' + m.label + ' \* 목표 ' + fmtFullReportNum\_(target, m.unit) + m.unit);  
 lines.push('- 당일 : ' + fmtFullReportNum\_(today, m.unit) + m.unit + ' / 누계 : ' + fmtFullReportNum\_(cum, m.unit) + m.unit + '(' + rate + '%)');  
 });  
 lines.push('');  
 });  
 return lines.join('\
').replace(/\
+$/, '');  
}  
  
/\*\* buildFullDailyReportText()의 결과에서 "- 당일 : ..." 실적 라인만 파란색으로 강조해 표시용 HTML을 만든다. \*/  
function buildFullDailyReportHtml\_(mode){  
 const text = buildFullDailyReportText(mode);  
 // "- 당일 : 200천원 / 누계 : 2,691천원(72%)" 형식의 줄에서 당일 금액만 파란색 볼드,  
 // 누계 금액+달성률만 빨간색 볼드로 강조하고 나머지(레이블/기호)는 검정 일반체로 남긴다.  
 const m2 = /^(- 당일s\*:s\*)(.+?)(s\*/s\*누계s\*:s\*)(.+?)((\[-d\]+%))$/;  
 return text.split('\
').map(function(line){  
 const m = line.match(m2);  
 if (m) {  
 return escHtml(m\[1\]) +  
 '\<span style="color:\#1a56db; font-weight:700;"\>' + escHtml(m\[2\]) + '\</span\>' +  
 escHtml(m\[3\]) +  
 '\<span style="color:\#c0392b; font-weight:700;"\>' + escHtml(m\[4\]) + escHtml(m\[5\]) + '\</span\>';  
 }  
 return escHtml(line);  
 }).join('\
');  
}

function openForecastInput\_(){  
 const products = \['알람','정보보안','휴엔','블루스캔'\];  
 const vals = {};  
 let canceled = false;  
 for (let i = 0; i \< products.length; i++) {  
 const p = products\[i\];  
 const cur = (DAILY\_FORECAST\_ORDERS && DAILY\_FORECAST\_ORDERS\[p\] \!= null)  
 ? DAILY\_FORECAST\_ORDERS\[p\]  
 : ((DAILY\_REPORT\_DATA && DAILY\_REPORT\_DATA\[p\] && DAILY\_REPORT\_DATA\[p\].수주\_당일) || 0);  
 const input = prompt('\[' + (DAILY\_COL\_LABELS\[p\] || p) + '\] 오늘 예상 수주 금액(천원)을 입력하세요.', String(cur));  
 if (input === null) { canceled = true; break; }  
 const num = Number(String(input).replace(/,/g, '').trim());  
 vals\[p\] = isNaN(num) ? 0 : num;  
 }  
 if (canceled) return;  
 DAILY\_FORECAST\_ORDERS = vals;  
 FULL\_REPORT\_MODE = '전망';  
 FULL\_REPORT\_TEXT\_EDITED = false;  
 const modeSelEl = document.getElementById('fullReportModeSelect');  
 if (modeSelEl) modeSelEl.value = '전망';  
 const fullEl = document.getElementById('fullReportText');  
 if (fullEl) fullEl.innerHTML = buildFullDailyReportHtml\_('전망');  
}

function regenerateFullReportText\_(){  
 const sel = document.getElementById('fullReportModeSelect');  
 const mode = (sel && sel.value) || FULL\_REPORT\_MODE || defaultFullReportMode\_();  
 FULL\_REPORT\_MODE = mode;  
 FULL\_REPORT\_TEXT\_EDITED = false;  
 const el = document.getElementById('fullReportText');  
 if (el) el.innerHTML = buildFullDailyReportHtml\_(mode);  
}  
  
function copyReportText\_(id){  
 try {  
 const el = document.getElementById(id);  
 if (\!el) return;  
 const isTextarea = el.tagName === 'TEXTAREA';  
 const text = isTextarea ? el.value : el.innerText;  
 if (navigator.clipboard && navigator.clipboard.writeText) {  
 navigator.clipboard.writeText(text).catch(function(){});  
 return;  
 }  
 if (isTextarea) {  
 el.focus();  
 el.select();  
 } else {  
 const range = document.createRange();  
 range.selectNodeContents(el);  
 const sel = window.getSelection();  
 sel.removeAllRanges();  
 sel.addRange(range);  
 }  
 document.execCommand('copy');  
 } catch (e) { /\* 클립보드 접근 실패는 무시 \*/ }  
}

/\*\* 깃발(선택)된 항목만 필터링하는 공통 헬퍼 \*/  
function getFilteredRowsForAction\_(scope, allRows) {  
 const onlyFlagged = chkVal(scope === 'order' ? 'onlyFlaggedOrder' : (scope === 'cancel' ? 'onlyFlaggedCancel' : (scope === 'price' ? 'onlyFlaggedPrice' : (scope === 'restart' ? 'onlyFlaggedRestart' : 'onlyFlaggedProductDaily'))), false);  
 if (\!onlyFlagged) return allRows;  
 return allRows.filter(r =\> FLAGGED\_SET.has(r.id));  
}  
  
/\*\* 인쇄/엑셀 출력용: 드롭다운(select)·달력 아이콘·삭제 버튼 등 편집용 요소를 제거하고 실제 값(텍스트)만 남긴다 \*/  
function normalizeCellForOutput\_(td) {  
 const select = td.querySelector('select');  
 if (select) {  
 const opt = select.options\[select.selectedIndex\];  
 td.textContent = opt ? opt.textContent : '';  
 return;  
 }  
 // 달력 아이콘 버튼, 숨은 date input, datalist 등 편집용 요소 제거  
 td.querySelectorAll('button, input\[type="date"\], datalist').forEach(el =\> el.remove());  
 const input = td.querySelector('input');  
 if (input) {  
 td.textContent = input.value || '';  
 return;  
 }  
}  
  
/\*\* 1. 원본 스타일 유지 인쇄 함수 (제목 흰 바탕 고정, 소팅 열 데이터 노란색 배경 반영) \*/  
function printGridData(scope) {  
 let rows, titleName;  
 if (scope === 'order') { rows = getFilteredRowsForAction\_('order', sortedRows()); titleName = '에스원 북서울지사 수주개시 현황'; }

 else if (scope === 'price') { rows = getFilteredRowsForAction\_('price', sortedPriceRows()); titleName = '에스원 북서울지사 인상인하 현황'; }  
 else if (scope === 'restart') { rows = getFilteredRowsForAction\_('restart', sortedRestartRows()); titleName = '에스원 북서울지사 재개시 현황'; }

 const onlyFlagged = chkVal(scope === 'order' ? 'onlyFlaggedOrder' : (scope === 'cancel' ? 'onlyFlaggedCancel' : (scope === 'price' ? 'onlyFlaggedPrice' : (scope === 'restart' ? 'onlyFlaggedRestart' : 'onlyFlaggedProductDaily'))), false);  
 if (onlyFlagged && (\!rows || rows.length === 0)) {  
 alert('선택된(깃발이 체크된) 항목이 없습니다.');  
 return;  
 }  
  
 const gridWrap = document.querySelector('.grid-wrap');  
 if (\!gridWrap) return;  
 const clonedTable = gridWrap.querySelector('table').cloneNode(true);  
  
 // 불필요한 첫 번째 열(깃발)과 마지막 열(관리 버튼) 제거  
 Array.from(clonedTable.querySelectorAll('tr')).forEach(tr =\> {  
 if (tr.cells.length \> 0) {  
 tr.deleteCell(0);  
 tr.deleteCell(tr.cells.length - 1);  
 }  
 });  
  
 // 드롭다운/달력 아이콘/버튼 등 편집용 요소 제거 (실제 값만 표시)  
 Array.from(clonedTable.querySelectorAll('tbody td')).forEach(td =\> normalizeCellForOutput\_(td));  
  
 if (onlyFlagged) {  
 const tbody = clonedTable.querySelector('tbody');  
 if (tbody) {  
 const allTrs = Array.from(tbody.querySelectorAll('tr'));  
 const targetIds = new Set(rows.map(r =\> String(r.id)));  
 allTrs.forEach(tr =\> {  
 const rowId = tr.getAttribute('data-id');  
 if (\!rowId || \!targetIds.has(rowId)) tr.remove();  
 });

 const totalCols = clonedTable.querySelector('tr') ? clonedTable.querySelector('tr').cells.length : 1;  
 const printDate = todayStr() + ' ' + String(new Date().getHours()).padStart(2,'0') + ':' + String(new Date().getMinutes()).padStart(2,'0');  
 const printUser = (SESSION && SESSION.name) ? SESSION.name : '지사장';  
  
 const thead = clonedTable.querySelector('thead');  
 if (thead) {

/\*\* 2. 원본 스타일 유지 엑셀 다운로드 함수 (제목 흰 바탕 고정, 소팅 열 데이터 노란색 배경 반영) \*/  
function exportGridToExcel(scope, filename) {  
 let rows, titleName;  
 if (scope === 'order') { rows = getFilteredRowsForAction\_('order', sortedRows()); titleName = '에스원 북서울지사 수주개시 현황'; }  
 else if (scope === 'cancel') { rows = getFilteredRowsForAction\_('cancel', sortedCancelRows()); titleName = '에스원 북서울지사 해약중지 현황'; }  
 else if (scope === 'price') { rows = getFilteredRowsForAction\_('price', sortedPriceRows()); titleName = '에스원 북서울지사 인상인하 현황'; }  
 else if (scope === 'restart') { rows = getFilteredRowsForAction\_('restart', sortedRestartRows()); titleName = '에스원 북서울지사 재개시 현황'; }  
 else if (scope === 'productdaily') { rows = getFilteredRowsForAction\_('productdaily', sortedProductDailyRows()); titleName = '에스원 북서울지사 상품일보 현황'; }  
  
 const onlyFlagged = chkVal(scope === 'order' ? 'onlyFlaggedOrder' : (scope === 'cancel' ? 'onlyFlaggedCancel' : (scope === 'price' ? 'onlyFlaggedPrice' : (scope === 'restart' ? 'onlyFlaggedRestart' : 'onlyFlaggedProductDaily'))), false);  
 if (onlyFlagged && (\!rows || rows.length === 0)) {  
 alert('선택된(깃발이 체크된) 항목이 없습니다.');  
 return;  
 }  
  
 let gridWrap = document.querySelector('.grid-wrap');  
 if (\!gridWrap) return;  
   
const clonedTable = gridWrap.querySelector('table').cloneNode(true);  
 Array.from(clonedTable.querySelectorAll('tr')).forEach(tr =\> {  
 if (tr.cells.length \> 0) {  
 tr.deleteCell(0);  
 tr.deleteCell(tr.cells.length - 1);  
 }  
 });  
  
 // 드롭다운/달력 아이콘/버튼 등 편집용 요소 제거 (실제 값만 표시)  
 Array.from(clonedTable.querySelectorAll('tbody td')).forEach(td =\> normalizeCellForOutput\_(td));  
  
 if (onlyFlagged) {  
 const tbody = clonedTable.querySelector('tbody');  
 if (tbody) {  
 const allTrs = Array.from(tbody.querySelectorAll('tr'));  
 const targetIds = new Set(rows.map(r =\> String(r.id)));  
 allTrs.forEach(tr =\> {  
 const rowId = tr.getAttribute('data-id');  
 if (\!rowId || \!targetIds.has(rowId)) tr.remove();  
 });  
 }  
 }  
  
 const totalCols = clonedTable.querySelector('tr') ? clonedTable.querySelector('tr').cells.length : 1;  
 const printDate = todayStr() + ' ' + String(new Date().getHours()).padStart(2,'0') + ':' + String(new Date().getMinutes()).padStart(2,'0');  
 const printUser = (SESSION && SESSION.name) ? SESSION.name : '지사장';  
  
 const thead = clonedTable.querySelector('thead');  
 if (thead) {  
 const titleTr = document.createElement('tr');  
 // 엑셀 상단 제목 행: 흰 바탕(\#ffffff) 고정  
 titleTr.innerHTML = \`\<th colspan="${totalCols}" style="background-color: \#ffffff; color: \#000000; font-size: 15pt; font-family: 'Malgun Gothic', sans-serif; padding: 12px 10px; text-align: left; border: none; mso-pattern: auto;"\>  
 \<b\>${titleName}\</b\> &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; 인쇄일자: ${printDate} | 인쇄자: ${printUser}  
 \</th\>\`;  
 thead.insertBefore(titleTr, thead.firstChild);  
 }  
  
 // 필드 헤더 스타일 지정  
 clonedTable.querySelectorAll('th').forEach(th =\> {  
 if (\!th.getAttribute('colspan')) {  
 th.setAttribute('style', 'background-color: \#4a86e8; color: \#ffffff; font-weight: bold; text-align: center; border: 1px solid \#3a6fc4; font-size: 12pt;');  
 }  
 });  
  
 // 엑셀 출력 시 소팅된 컬럼 셀 데이터 부분에 노란색 바탕(\#ffff00) 반영  
 clonedTable.querySelectorAll('td.sort-col').forEach(td =\> {  
 td.setAttribute('style', 'background-color: \#ffff00 \!important; font-weight: bold; border: 1px solid \#cfd6dc; font-size: 12pt;');  
 });  
  
 const htmlContent = \`  
 \<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40"\>  
 \<head\>\<meta charset="utf-8"\>  
 \<style\>  
 table { font-family: 'Malgun Gothic', sans-serif; font-size: 12pt; }  
 th { background-color: \#4a86e8; color: \#ffffff; font-size: 12pt; }  
 td { font-size: 12pt; }  
 td.sort-col { background-color: \#ffff00; font-weight: bold; font-size: 12pt; }  
 \</style\>  
 \</head\>  
 \<body\>  
 \<table border="1"\>${clonedTable.innerHTML}\</table\>  
 \</body\>  
 \</html\>  
 \`;  
  
 // 파일명 뒤에 내보내기 일시(YYYYMMDD\_HHmm)를 붙여 매번 고유한 파일명으로 저장  
 const exportTs = todayStr().replace(/-/g, '') + '\_' + String(new Date().getHours()).padStart(2, '0') + String(new Date().getMinutes()).padStart(2, '0');  
 const dotIdx = filename.lastIndexOf('.');  
 const timestampedFilename = dotIdx \> -1 ? (filename.slice(0, dotIdx) + '\_' + exportTs + filename.slice(dotIdx)) : (filename + '\_' + exportTs);  
  
 const blob = new Blob(\[htmlContent\], { type: 'application/vnd.ms-excel;charset=utf-8;' });  
 const url = URL.createObjectURL(blob);  
 const a = document.createElement('a');  
 a.href = url;  
 a.download = timestampedFilename;  
 document.body.appendChild(a);  
 a.click();  
 document.body.removeChild(a);  
}  
  
/\* ===================== 3. 선택(깃발)된 행을 이미지(PNG)로 캡처 ===================== \*/  
/\*\* html2canvas(CDN)가 아직 로드되지 않았을 수 있으므로, 준비될 때까지 잠시 대기 후 실행 \*/  
function ensureImgExportLibReady\_(cb){  
 if (window.html2canvas) { cb(); return; }  
 let tries = 0;  
 const timer = setInterval(function(){  
 tries++;  
 if (window.html2canvas) { clearInterval(timer); cb(); }  
 else if (tries \> 50) { clearInterval(timer); alert('이미지 저장 기능을 불러오지 못했습니다. 인터넷 연결을 확인하신 뒤 새로고침 후 다시 시도해 주세요.'); }  
 }, 100);  
}  
  
/\*\* 화면별로 이미지에 담을 컬럼 정의(요청 서식: 구분/계약번호/계약처명/영업담당/담당차량/보고일/계약일/개시일/기산일/용역료/상품1) \*/  
const IMG\_EXPORT\_COLUMNS\_ = {  
 order: \[  
 { key:'구분', label:'구분', align:'center' },  
 { key:'계약번호', label:'계약번호', align:'center' },  
 { key:'계약처명', label:'계약처명', align:'left' },  
 { key:'영업담당', label:'영업담당', align:'center' },  
 { key:'담당차량', label:'담당차량', align:'center' },  
 { key:'보고일', label:'보고일', align:'center', date:true },  
 { key:'계약일', label:'계약일', align:'center', date:true },  
 { key:'개시일', label:'개시일', align:'center', date:true, highlight:'green' },  
 { key:'기산일', label:'기산일', align:'center', date:true, highlight:'yellow' },  
 { key:'용역료', label:'용역료', align:'right', money:true },  
 { key:'상품', label:'상품1', align:'center' }  
 \]  
};  
const IMG\_EXPORT\_TITLE\_ = { order: '에스원 북서울지사 수주개시 현황' };  
const IMG\_EXPORT\_ROWS\_ = { order: function(){ return sortedRows(); } };  
  
let GRID\_IMG\_PREVIEW\_DATAURL\_ = '';  
let GRID\_IMG\_PREVIEW\_NAME\_ = 'export';  
  
/\*\* 선택(깃발)된 행만 골라 첨부 이미지와 동일한 서식(헤더 파란색, 개시일 녹색, 기산일 노란색, 용역료 파란 글씨,  
 \* 계약처명 옆에 비고를 빨간 굵은 글씨로 괄호 표기)의 표를 만들어 PNG로 캡처한다. \*/  
function exportGridToImage(scope){  
 const cols = IMG\_EXPORT\_COLUMNS\_\[scope\];  
 const getRows = IMG\_EXPORT\_ROWS\_\[scope\];  
 if (\!cols || \!getRows) return;  
  
 const flaggedRows = getRows().filter(r =\> FLAGGED\_SET.has(r.id));  
 if (\!flaggedRows.length) { alert('선택된(깃발이 체크된) 항목이 없습니다.'); return; }  
  
 const titleName = IMG\_EXPORT\_TITLE\_\[scope\] || '';  
 const borderColor = '\#2b3a55';  
 const headerBg = '\#c9d5ea';  
 const yellowBg = '\#ffff00';  
 const greenBg = '\#d9ead3';  
  
 let tableHtml = '\<table style="border-collapse:collapse; font-family:'Malgun Gothic',sans-serif; background:\#ffffff;"\>';  
 tableHtml += '\<thead\>\<tr\>';  
 cols.forEach(function(c){  
 const bg = (c.highlight === 'yellow') ? yellowBg : headerBg;  
 tableHtml += '\<th style="border:1px solid ' + borderColor + '; background:' + bg + '; color:\#1a1a2e; font-weight:700; font-size:15px; padding:10px 14px; white-space:nowrap;"\>' + escHtml(c.label) + '\</th\>';  
 });  
 tableHtml += '\</tr\>\</thead\>\<tbody\>';  
  
 flaggedRows.forEach(function(row){  
 tableHtml += '\<tr\>';  
 cols.forEach(function(c){  
 const raw = row\[c.key\];  
 let displayVal;  
 if (c.key === '계약처명') {  
 displayVal = 
      if (c.key === '계약처명') {
        displayVal = escHtml(raw || '');
        if (row.비고) displayVal += ' <span style="color:#c00000; font-weight:700;">(' + escHtml(row.비고) + ')</span>';
      } else if (c.money) {
        displayVal = commaFmt(raw);
      } else if (c.date) {
        displayVal = escHtml(fmtMD(raw));
      } else {
        displayVal = escHtml(raw != null ? raw : '');
      }
      let bg = '#ffffff';
      let color = '#222222';
      if (c.highlight === 'yellow') { bg = yellowBg; color = '#6b5b00'; }
      else if (c.highlight === 'green') { bg = greenBg; color = '#274e13'; }
      if (c.money) color = '#1155cc';
      tableHtml += '<td style="border:1px solid ' + borderColor + '; background:' + bg + '; color:' + color + '; text-align:' + c.align + '; font-weight:' + (c.highlight || c.money ? '700' : '500') + '; font-size:14px; padding:9px 14px; white-space:nowrap;">' + displayVal + '</td>';
    });
    tableHtml += '</tr>';
  });
  tableHtml += '</tbody></table>';

  const container = document.createElement('div');
  container.style.cssText = 'position:fixed; left:-99999px; top:0; padding:16px; background:#ffffff; display:inline-block;';
  container.innerHTML = tableHtml;
  document.body.appendChild(container);

  ensureImgExportLibReady_(function(){
    html2canvas(container, { backgroundColor: '#ffffff', scale: 2 }).then(function(canvas){
      if (container.parentNode) document.body.removeChild(container);
      GRID_IMG_PREVIEW_DATAURL_ = canvas.toDataURL('image/png');
      GRID_IMG_PREVIEW_NAME_ = (titleName || 'export').replace(/\s+/g, '_');
      document.getElementById('gridImgPreviewTitle').innerText = titleName + ' - 선택 ' + flaggedRows.length + '건';
      document.getElementById('gridImgPreviewImg').src = GRID_IMG_PREVIEW_DATAURL_;
      document.getElementById('gridImgPreviewOverlay').classList.add('open');
    }).catch(function(err){
      if (container.parentNode) document.body.removeChild(container);
      alert('이미지 생성 실패: ' + err);
    });
  });
}
function closeGridImgPreview_(){ document.getElementById('gridImgPreviewOverlay').classList.remove('open'); }
function downloadGridImgPreview_(){
  if (!GRID_IMG_PREVIEW_DATAURL_) return;
  const a = document.createElement('a');
  a.href = GRID_IMG_PREVIEW_DATAURL_;
  a.download = GRID_IMG_PREVIEW_NAME_ + '_' + todayStr() + '.png';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

        if (!res || !res.success) { prevEl.innerHTML = '<div class="denied">' + escHtml((res && res.error) || '표를 인식하지 못했습니다.') + '</div>'; return; }
        GAJUNGJI_ROWS_ = res.rows || [];
        renderGaJungjiPreview_();
        gaJungjiDoSubmit_();
      })
      .withFailureHandler(function(err){ prevEl.innerHTML = '<div class="denied">분석 실패: ' + escHtml(String(err)) + '</div>'; })
      .parseGaJungjiText(SESSION.token, text);
    return;
  }
  gaJungjiDoSubmit_();
}
function gaJungjiDoSubmit_(){
  const text = (document.getElementById('gaJungjiInput').value || '').trim();
  showLoadingProgress_('gaJungjiResult', '제출 중입니다...');
  setLoadingCursor(true);
  google.script.run
    .withSuccessHandler(function(res){
      setLoadingCursor(false);
      if (!res || !res.success) { document.getElementById('gaJungjiResult').innerHTML = '<div class="denied">제출 실패: ' + escHtml((res && res.error) || '알 수 없는 오류') + '</div>'; return; }
      document.getElementById('gaJungjiResult').innerHTML = '<div style="color:#2e7d32; font-size:13px;">제출되었습니다. 마스터 확인 후 해약중지로 등록됩니다.</div>';
      setTimeout(closeGaJungjiModal_, 1200);
    })
    .withFailureHandler(function(err){ setLoadingCursor(false); document.getElementById('gaJungjiResult').innerHTML = '<div class="denied">제출 실패: ' + escHtml(String(err)) + '</div>'; })
    .submitGaJungjiMessage(SESSION.token, text);
}

/* ===================== 초기화 ===================== */
SESSION = loadSession();
if (SESSION && SESSION.token) {
  hideLogin();
  document.getElementById('whoami').style.display = '';
  document.getElementById('whoami').innerText = SESSION.name + '님' + ' [직무:' + (jobLabel_(SESSION.job) || '미지정') + ']';
  document.getElementById('logoutLink').style.display = '';
  document.getElementById('gaJungjiTopBtn').style.display = (SESSION.job === '서비스(CS)') ? '' : 'none';
  renderTabs();
  selectTab('dashboard');
  loadAndApplyEditableLists_();
  preloadAllTabsInBackground_();
  startHeartbeat_();
} else {
  showLogin();
}
</script>
