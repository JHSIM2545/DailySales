name: Build Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'android/twa-manifest.json'
      - 'icons/icon-512.png'
      - 'icons/icon-maskable-512.png'
      - '.github/workflows/build-apk.yml'
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Wait until GitHub Pages serves the new icon
        run: |
          want=$(sha256sum icons/icon-512.png | cut -d' ' -f1)
          for i in $(seq 1 40); do
            got=$(curl -fsSL "https://jhsim2545.github.io/DailySales/icons/icon-512.png?$RANDOM" | sha256sum | cut -d' ' -f1)
            [ "$got" = "$want" ] && echo "icon live" && exit 0
            echo "waiting for Pages ($i)"; sleep 15
          done
          echo "Pages icon not updated in time (continuing)"
      - name: Install Bubblewrap
        run: npm i -g @bubblewrap/cli
      - name: Configure Bubblewrap
        run: |
          mkdir -p ~/.bubblewrap
          echo "{\"jdkPath\":\"$JAVA_HOME\",\"androidSdkPath\":\"$ANDROID_HOME\"}" > ~/.bubblewrap/config.json
      - name: Signing key (repo secret if set, else new key)
        working-directory: android
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then echo "$KS_B64" | base64 -d > android.keystore
          else keytool -genkeypair -v -keystore android.keystore -alias dailysales -keyalg RSA -keysize 2048 -validity 10000 -storepass dailysales-pw -keypass dailysales-pw -dname "CN=S1 Bukseoul, O=S1, C=KR"; fi
      - name: Build APK
        working-directory: android
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'dailysales-pw' }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'dailysales-pw' }}
        run: |
          yes "" | bubblewrap build --skipPwaValidation
          ls -la
          keytool -list -v -keystore android.keystore -alias dailysales -storepass "$BUBBLEWRAP_KEYSTORE_PASSWORD" | grep SHA256 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Publish APK to repo (served by Pages)
        run: |
          mkdir -p download
          cp android/app-release-signed.apk download/DailySales.apk
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add download/DailySales.apk
          git commit -m "chore: update Android APK" || echo "no change"
          git push
      - uses: actions/upload-artifact@v4
        with: { name: DailySales-apk, path: download/DailySales.apk }
